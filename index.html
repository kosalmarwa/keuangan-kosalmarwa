<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Google API dimuat setelah fungsi callback didefinisikan -->
  <script>
    // ─── KONFIGURASI GOOGLE SHEETS & DRIVE ──────────────────────────────────
    const GS_CLIENT_ID    = '895565907296-5n6shrl9cl45e1blap73bfduuqasl6sh.apps.googleusercontent.com';
    const GS_API_KEY      = 'AIzaSyCnB90Cfay49siCRp1UpS5HAZ9h7HfuAII';
    const GS_SPREADSHEET  = '1K3PQqNskDK1BnJYJr0dT8n-tEVWeo8lbIwx1IzpBeFc';
    const GD_FOLDER_ID    = '1uBM-eiXCVwG40DySZX-qrdUl-Umqd2oy'; // Folder Bukti Kos Almarwa
    const GS_SCOPE        = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
    const GS_DISCOVERY    = 'https://sheets.googleapis.com/$discovery/rest?version=v4';

    let gsTokenClient = null;
    let gsGapiReady   = false;
    let gsGsiReady    = false;
    let gsSignedIn    = false;

    // Load GAPI client
    window.gapiLoaded = function() {
      gapi.load('client', async () => {
        await gapi.client.init({ apiKey: GS_API_KEY, discoveryDocs: [GS_DISCOVERY] });
        gsGapiReady = true;
      });
    };

    // Load GSI (Google Sign-In)
    window.gsiLoaded = function() {
      gsTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GS_CLIENT_ID,
        scope: GS_SCOPE,
        callback: (resp) => {
          if(resp.error) { console.error(resp); return; }
          gsSignedIn = true;
          window.dispatchEvent(new Event('gs-signed-in'));
        },
      });
      gsGsiReady = true;
    };

    // Sign In
    window.gsSignIn = () => new Promise((resolve, reject) => {
      if(gsSignedIn){ resolve(); return; }
      if(!gsGapiReady || !gsGsiReady){ reject('Google API belum siap'); return; }
      window.addEventListener('gs-signed-in', () => resolve(), { once: true });
      gsTokenClient.requestAccessToken({ prompt: 'consent' });
    });

    // Sign Out
    window.gsSignOut = () => {
      google.accounts.oauth2.revoke(gapi.client.getToken().access_token, ()=>{
        gapi.client.setToken('');
        gsSignedIn = false;
        window.dispatchEvent(new Event('gs-signed-out'));
      });
    };

    // Simpan semua data ke Google Sheets
    window.gsSave = async (data) => {
      // ── PENGAMAN UTAMA: jangan pernah menimpa Sheets dengan data kosong ──
      // Mencegah data hilang bila state belum sempat termuat dari Sheets.
      const _totalRows = (data.transaksi?.length||0) + (data.kamar?.length||0) +
                         (data.aset?.length||0) + (data.kewajiban?.length||0);
      if(_totalRows === 0){
        throw new Error('SAVE_DIBATALKAN: semua tabel kosong, penyimpanan dibatalkan demi keamanan.');
      }
      await window.gsSignIn();
      const sheets = [
        { name:'Transaksi',   rows: data.transaksi,  headers:['id','tanggal','jenis','kategori','deskripsi','jumlah','kamar','rekening','bukti','buktiNama','buktiThumb','buktiDrive','buktiId'] },
        { name:'Kamar',       rows: data.kamar,      headers:['id','nomor','penghuni','harga','status','masuk','akhirSewa','telepon'] },
        { name:'Aset',        rows: data.aset,       headers:['id','nama','nilai','penyusutan','jenis','keterangan','tanggalBeli','usiaPakai'] },
        { name:'Kewajiban',   rows: data.kewajiban,  headers:['id','nama','jumlah','cicilan'] },
      ];
      for(const s of sheets){
        const values = [s.headers, ...s.rows.map(r => s.headers.map(h => {
          const v = r[h];
          return v === null || v === undefined ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
        }))];
        try {
          await gapi.client.sheets.spreadsheets.values.clear({
            spreadsheetId: GS_SPREADSHEET, range: `${s.name}!A:Z`,
          });
        } catch(err) { console.warn(`Gagal clear ${s.name}:`, err); }
        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: GS_SPREADSHEET, range: `${s.name}!A1`,
          valueInputOption: 'RAW', resource: { values },
        });
      }
      // Simpan timestamp dan settings ke tab Settings (key-value)
      const ts = Date.now();
      try {
        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: GS_SPREADSHEET, range: 'Settings!A1',
          valueInputOption: 'RAW',
          resource: { values: [
            ['key','value','keterangan'],
            ['savedAt',    String(ts),                    'Timestamp terakhir disimpan'],
            ['modalPemilik', String(data.modalPemilik||0), 'Modal Pemilik (Rp) — diinput manual di tab Aset'],
          ]},
        });
      } catch(e) { console.warn('Settings sheet error:', e); }
      // Tetap update Meta untuk backward compatibility
      try {
        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: GS_SPREADSHEET, range: 'Meta!A1',
          valueInputOption: 'RAW',
          resource: { values: [['savedAt','modalPemilik'],[String(ts),String(data.modalPemilik||0)]] },
        });
      } catch(e) { /* Meta mungkin tidak ada, tidak apa-apa */ }
      // ── CADANGAN OTOMATIS: simpan snapshot ke tab Backup (tidak pernah menghapus) ──
      try { await window.gsBackup(data, ts); } catch(e){ console.warn('Backup gagal (data utama tetap tersimpan):', e); }
      return ts;
    };

    // Pastikan sebuah tab/sheet ada; buat + tulis header bila belum ada.
    window.gsEnsureSheet = async (title, header) => {
      let created = false;
      try {
        const meta = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: GS_SPREADSHEET });
        const exists = (meta.result.sheets||[]).some(sh => sh.properties.title === title);
        if(!exists){
          await gapi.client.sheets.spreadsheets.batchUpdate({
            spreadsheetId: GS_SPREADSHEET,
            resource: { requests: [{ addSheet: { properties: { title } } }] },
          });
          created = true;
          if(header){
            await gapi.client.sheets.spreadsheets.values.update({
              spreadsheetId: GS_SPREADSHEET, range: title+'!A1',
              valueInputOption: 'RAW', resource: { values: [header] },
            });
          }
        }
      } catch(e){ console.warn('ensureSheet', title, e); }
      return created;
    };

    // Simpan snapshot data ke tab Backup. Memakai append → riwayat cadangan
    // tidak pernah tertimpa/terhapus, jadi selalu bisa dipulihkan manual.
    window.gsBackup = async (data, ts) => {
      await window.gsEnsureSheet('Backup', ['timestamp','waktu','data_json']);
      const snapshot = JSON.stringify({
        transaksi:    data.transaksi  || [],
        kamar:        data.kamar      || [],
        aset:         data.aset       || [],
        kewajiban:    data.kewajiban  || [],
        modalPemilik: data.modalPemilik || 0,
      });
      const waktu = new Date(ts).toLocaleString('id-ID');
      await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: GS_SPREADSHEET,
        range: 'Backup!A:C',
        valueInputOption: 'RAW',
        insertDataOption: 'INSERT_ROWS',
        resource: { values: [[ String(ts), waktu, snapshot ]] },
      });
    };

    // Ambil timestamp terakhir dari Google Sheets (tanpa load semua data)
    window.gsGetTimestamp = async () => {
      await window.gsSignIn();
      try {
        // Coba baca dari Settings dulu
        const resp = await gapi.client.sheets.spreadsheets.values.get({
          spreadsheetId: GS_SPREADSHEET, range: 'Settings!A1:B10',
        });
        const rows = resp.result.values || [];
        if(rows.length >= 2) {
          const dataRows = rows.slice(1);
          const tsRow = dataRows.find(r=>r[0]==='savedAt');
          if(tsRow) return Number(tsRow[1]) || 0;
        }
      } catch(e) {}
      // Fallback ke Meta
      try {
        const resp = await gapi.client.sheets.spreadsheets.values.get({
          spreadsheetId: GS_SPREADSHEET, range: 'Meta!A1:A2',
        });
        const rows = resp.result.values || [];
        if(rows.length >= 2) return Number(rows[1][0]) || 0;
        return 0;
      } catch(e) { return 0; }
    };

    // Muat semua data dari Google Sheets
    window.gsLoad = async () => {
      await window.gsSignIn();
      const sheetNames = ['Transaksi','Kamar','Aset','Kewajiban'];
      const result = {};
      for(const name of sheetNames){
        let resp;
        try {
          resp = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: GS_SPREADSHEET, range: name,
          });
        } catch(err) {
          console.warn(`Gagal membaca sheet ${name}:`, err);
          resp = { result: { values: [] } };
        }
        const rows = resp.result.values || [];
        if(rows.length < 2){ result[name.toLowerCase()] = []; continue; }
        const headers = rows[0];
        result[name.toLowerCase()] = rows.slice(1).map(row => {
          const obj = {};
          headers.forEach((h,i) => {
            const v = row[i] || '';
            // Angka
            if(['id','jumlah','harga','penyusutan','cicilan','nilai','usiaPakai'].includes(h))
              obj[h] = v === '' ? 0 : Number(v);
            // Boolean
            else if(h === 'buktiDrive')
              obj[h] = v === 'true';
            // String kosong → null untuk kolom bukti
            else if(['bukti','buktiNama','buktiThumb','buktiId'].includes(h))
              obj[h] = v === '' ? null : v;
            else obj[h] = v;
          });
          return obj;
        });
      }
      // Ambil savedAt dan modalPemilik dari Settings (utama) atau Meta (fallback)
      let savedAt = 0, modalPemilik = null;
      try {
        const settingsResp = await gapi.client.sheets.spreadsheets.values.get({
          spreadsheetId: GS_SPREADSHEET, range: 'Settings!A1:C10',
        });
        const sRows = settingsResp.result.values || [];
        if(sRows.length >= 2) {
          const dataRows = sRows.slice(1); // skip header row
          const tsRow = dataRows.find(r=>r[0]==='savedAt');
          const mpRow = dataRows.find(r=>r[0]==='modalPemilik');
          if(tsRow) savedAt = Number(tsRow[1]) || 0;
          if(mpRow) { const v=Number(mpRow[1]); if(v>0) modalPemilik=v; }
        }
      } catch(e) {
        // Fallback ke Meta sheet (data lama)
        try {
          const metaResp = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: GS_SPREADSHEET, range: 'Meta!A1:B2',
          });
          const metaRows = metaResp.result.values || [];
          const headers  = metaRows[0] || [];
          const values   = metaRows[1] || [];
          const idxTs = headers.indexOf('savedAt');
          const idxMP = headers.indexOf('modalPemilik');
          if(idxTs>=0) savedAt = Number(values[idxTs]) || 0;
          if(idxMP>=0) { const v=Number(values[idxMP]); if(v>0) modalPemilik=v; }
        } catch(e2) {}
      }
      result._savedAt     = savedAt;
      result.modalPemilik = modalPemilik; // null jika tidak ditemukan / 0
      return result;
    };

    window.gsIsReady = () => gsGapiReady && gsGsiReady;
    window.gsIsSignedIn = () => gsSignedIn;

    // Upload file bukti ke Google Drive — kembalikan URL yang bisa dibuka
    window.gsDriveUpload = async (file) => {
      await window.gsSignIn();
      const token = gapi.client.getToken();
      if(!token) throw new Error('Tidak ada token akses');

      // Buat metadata file
      const metadata = {
        name: file.name,
        parents: [GD_FOLDER_ID],
        mimeType: file.type,
      };

      // Buat form multipart
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
      form.append('file', file);

      // Upload ke Drive API
      const resp = await fetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,webContentLink',
        {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token.access_token },
          body: form,
        }
      );
      if(!resp.ok) {
        const err = await resp.json();
        throw new Error('Upload Drive gagal: ' + (err.error?.message || resp.status));
      }
      const result = await resp.json();

      // Set permission agar bisa dilihat siapapun dengan link
      await fetch(
        `https://www.googleapis.com/drive/v3/files/${result.id}/permissions`,
        {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token.access_token,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ role:'reader', type:'anyone' }),
        }
      );

      // Kembalikan URL preview
      return {
        fileId:   result.id,
        nama:     result.name,
        viewUrl:  `https://drive.google.com/file/d/${result.id}/view`,
        thumbUrl: `https://drive.google.com/thumbnail?id=${result.id}&sz=w200`,
      };
    };
  </script>

// ─── MODAL RINCIAN DASHBOARD ────────────────────────────────────────────────
function ModalRincian({info, onClose, bulan, tahun}) {
  if(!info) return null;
  const {jenis, data, label} = info;
  const isM = jenis==="Pemasukan";
  const hasRekening = !!label;
  const rekeningLabel = label ? (label==="Al Marwa"?"🏦 Al Marwa":"👤 Pribadi") : "";
  const [activeTab, setActiveTab] = React.useState("kategori");

  // ── Kalkulasi ────────────────────────────────────────────────────────────
  const total = data.reduce((s,t)=>s+t.jumlah,0);

  // Per Kategori
  const grp = {};
  data.forEach(t=>{ grp[t.kategori]=(grp[t.kategori]||0)+t.jumlah; });
  const sortedKat = Object.entries(grp).sort((a,b)=>b[1]-a[1]);

  // Per Bulan — hanya untuk mode rekening (data akumulasi)
  const grpBln = {};
  data.forEach(t=>{
    const d = new Date(t.tanggal);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    grpBln[key] = (grpBln[key]||0)+t.jumlah;
  });
  const sortedBln = Object.entries(grpBln).sort((a,b)=>a[0].localeCompare(b[0]));

  // Rentang periode
  const periodeLabel = (() => {
    if(!hasRekening) return `${BULAN[bulan-1]} ${tahun}`;
    if(!sortedBln.length) return `s/d ${BULAN[bulan-1]} ${tahun}`;
    const first = sortedBln[0][0];
    const [fy,fm] = first.split("-").map(Number);
    return `${BULAN[fm-1]} ${fy} s/d ${BULAN[bulan-1]} ${tahun} (${sortedBln.length} bulan)`;
  })();

  const accentColor = isM?"var(--green)":"var(--rose)";
  const tabStyle = (t) => ({
    padding:"7px 18px", fontSize:13, fontWeight:activeTab===t?700:500,
    borderRadius:8, border:"none", cursor:"pointer",
    background:activeTab===t?accentColor:"transparent",
    color:activeTab===t?"white":"var(--text-soft)",
    transition:"all .2s"
  });

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:520}} onClick={e=>e.stopPropagation()}>

        {/* Judul */}
        <div className="modal-title" style={{color:accentColor,marginBottom:4}}>
          {isM?"📈 Rincian Pemasukan":"📉 Rincian Pengeluaran"}
          {hasRekening && <span style={{fontSize:14,fontWeight:600,marginLeft:8,
            padding:"2px 10px",borderRadius:8,background:"rgba(0,0,0,0.06)"}}>{rekeningLabel}</span>}
        </div>
        <div style={{fontSize:12,color:"var(--text-soft)",marginBottom:16}}>{periodeLabel}</div>

        {/* Tab switcher — hanya tampil jika mode rekening */}
        {hasRekening && (
          <div style={{display:"flex",gap:4,background:"var(--rose-pale)",borderRadius:10,
            padding:4,marginBottom:16,width:"fit-content"}}>
            <button style={tabStyle("kategori")} onClick={()=>setActiveTab("kategori")}>Per Kategori</button>
            <button style={tabStyle("bulan")} onClick={()=>setActiveTab("bulan")}>Per Bulan</button>
          </div>
        )}

        {/* Tab: Per Kategori */}
        {(activeTab==="kategori"||!hasRekening) && (
          <div style={{maxHeight:340,overflowY:"auto"}}>
            {sortedKat.length===0 && (
              <div style={{padding:"20px",textAlign:"center",color:"var(--text-soft)"}}>
                Tidak ada data {jenis.toLowerCase()}.
              </div>
            )}
            {sortedKat.map(([kat,val])=>(
              <div key={kat} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                padding:"10px 4px",borderBottom:"1px solid var(--border)"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{kat}</div>
                  <div style={{fontSize:11,color:"var(--text-soft)"}}>
                    {data.filter(t=>t.kategori===kat).length} transaksi
                    {total>0?` · ${Math.round(val/total*100)}%`:""}
                  </div>
                </div>
                <div style={{fontWeight:700,fontSize:14,color:accentColor}}>{fmt(val)}</div>
              </div>
            ))}
          </div>
        )}

        {/* Tab: Per Bulan */}
        {activeTab==="bulan" && hasRekening && (
          <div style={{maxHeight:340,overflowY:"auto"}}>
            {sortedBln.length===0 && (
              <div style={{padding:"20px",textAlign:"center",color:"var(--text-soft)"}}>
                Tidak ada data {jenis.toLowerCase()}.
              </div>
            )}
            {sortedBln.map(([key,val])=>{
              const [fy,fm]=key.split("-").map(Number);
              const pct = total>0?Math.round(val/total*100):0;
              return (
                <div key={key} style={{display:"flex",justifyContent:"space-between",
                  alignItems:"center",padding:"9px 4px",borderBottom:"1px solid var(--border)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:80,fontSize:13,fontWeight:600}}>{BULAN[fm-1].slice(0,3)} {fy}</div>
                    <div style={{width:120,height:6,borderRadius:4,background:"var(--border)",overflow:"hidden"}}>
                      <div style={{width:`${pct}%`,height:"100%",borderRadius:4,background:accentColor,opacity:0.7}}/>
                    </div>
                    <div style={{fontSize:11,color:"var(--text-soft)",width:32}}>{pct}%</div>
                  </div>
                  <div style={{fontWeight:700,fontSize:14,color:accentColor}}>{fmt(val)}</div>
                </div>
              );
            })}
          </div>
        )}

        {/* Total */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"12px 4px",borderTop:"2px solid var(--border)",marginTop:8}}>
          <span style={{fontWeight:700,fontSize:14}}>Total {jenis}</span>
          <span style={{fontWeight:800,fontSize:16,color:accentColor}}>{fmt(total)}</span>
        </div>
        <div className="modal-footer" style={{marginTop:12}}>
          <button className="btn btn-secondary" onClick={onClose}>Tutup</button>
        </div>
      </div>
    </div>
  );
}

            Variabel: <code>{"{nama}"}</code> · <code>{"{kamar}"}</code> · <code>{"{tanggal}"}</code> · <code>{"{harga}"}</code>
          </div>

// ─── FILTER TRANSAKSI (Tab Transaksi) ───────────────────────────────────────
function TransaksiFilterBar({transaksi, filter, setFilter}) {
  // Daftar nilai unik dari data transaksi bulan ini
  const daftarKamar = React.useMemo(()=>{
    const s = [...new Set(transaksi.map(t=>t.kamar).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"id",{numeric:true}));
    return s;
  },[transaksi]);

  const daftarKategori = React.useMemo(()=>{
    let list = transaksi;
    if(filter.jenis) list = list.filter(t=>t.jenis===filter.jenis);
    return [...new Set(list.map(t=>t.kategori).filter(Boolean))].sort();
  },[transaksi, filter.jenis]);

  const selStyle = {padding:"7px 12px",fontSize:13,borderRadius:8,border:"1.5px solid var(--border)",background:"var(--surface)",color:"var(--text)",minWidth:130};
  const hasFilter = filter.jenis||filter.kategori||filter.rekening||filter.kamar;

  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",marginBottom:16,
      background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:12,padding:"14px 18px"}}>
      <span style={{fontWeight:600,fontSize:13,color:"var(--text-soft)",marginRight:4}}>🔍 Filter:</span>

      <select style={selStyle} value={filter.jenis}
        onChange={e=>setFilter(f=>({...f,jenis:e.target.value,kategori:""}))}>
        <option value="">Semua Jenis</option>
        <option value="Pemasukan">▲ Pemasukan</option>
        <option value="Pengeluaran">▼ Pengeluaran</option>
      </select>

      <select style={selStyle} value={filter.kategori}
        onChange={e=>setFilter(f=>({...f,kategori:e.target.value}))}>
        <option value="">Semua Kategori</option>
        {daftarKategori.map(k=><option key={k} value={k}>{k}</option>)}
      </select>

      <select style={selStyle} value={filter.rekening}
        onChange={e=>setFilter(f=>({...f,rekening:e.target.value}))}>
        <option value="">Semua Rekening</option>
        <option value="Al Marwa">🏦 Al Marwa</option>
        <option value="Pribadi">👤 Pribadi</option>
      </select>

      <select style={selStyle} value={filter.kamar}
        onChange={e=>setFilter(f=>({...f,kamar:e.target.value}))}>
        <option value="">Semua Kamar</option>
        {daftarKamar.map(k=><option key={k} value={k}>Kamar {k}</option>)}
      </select>

      {hasFilter && (
        <button style={{padding:"7px 14px",fontSize:12,borderRadius:8,border:"none",
          background:"rgba(123,45,62,0.1)",color:"var(--burgundy)",cursor:"pointer",fontWeight:600}}
          onClick={()=>setFilter({jenis:"",kategori:"",rekening:"",kamar:""})}>
          ✕ Reset Filter
        </button>
      )}

      {hasFilter && (
        <span style={{marginLeft:"auto",fontSize:12,color:"var(--text-soft)",fontStyle:"italic"}}>
          {transaksi.filter(t=>{
            if(filter.jenis && t.jenis!==filter.jenis) return false;
            if(filter.kategori && t.kategori!==filter.kategori) return false;
            if(filter.rekening && (t.rekening||"Al Marwa")!==filter.rekening) return false;
            if(filter.kamar && t.kamar!==filter.kamar) return false;
            return true;
          }).length} dari {transaksi.length} transaksi
        </span>
      )}
    </div>
  );
}

// ─── TABEL TRANSAKSI ────────────────────────────────────────────────────────
function TransaksiTable({data, onDelete, onEdit, short, sort, setSort}) {
  const [viewBukti, setViewBukti] = React.useState(null);

  const sortedData = React.useMemo(()=>{
    if(!sort||!sort.col||sort.dir===0) return data;
    return [...data].sort((a,b)=>{
      let va=a[sort.col]||"", vb=b[sort.col]||"";
      if(sort.col==="jumlah"){ va=Number(va)||0; vb=Number(vb)||0; return sort.dir*(va-vb); }
      if(sort.col==="tanggal"){ return sort.dir*(new Date(va)-new Date(vb)); }
      return sort.dir*(String(va).localeCompare(String(vb),"id"));
    });
  },[data,sort]);

  const SortTh = ({col, label}) => {
    if(!setSort) return <th>{label}</th>;
    const active = sort&&sort.col===col&&sort.dir!==0;
    const icon = active?(sort.dir===1?"▲":"▼"):"↕";
    return (
      <th style={{cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"}}
        onClick={()=>setSort(s=>{
          if(s.col!==col) return {col,dir:1};
          if(s.dir===1) return {col,dir:-1};
          return {col:"",dir:0};
        })}>
        {label} <span style={{fontSize:10,opacity:active?1:0.3,color:active?"var(--burgundy)":"inherit"}}>{icon}</span>
      </th>
    );
  };

  if(!data.length) return (
    <div className="empty-state">
      <div className="empty-icon">📭</div>
      <div className="empty-text">Belum ada transaksi pada periode ini.</div>
    </div>
  );
  return (
    <>
    <div className="table-wrap">
      <table>
        <thead>
          <tr>
            <SortTh col="tanggal" label="Tanggal"/>
            <SortTh col="jenis" label="Jenis"/>
            <SortTh col="kategori" label="Kategori"/>
            {!short && <th>Keterangan</th>}
            <SortTh col="jumlah" label="Jumlah"/>
            {!short && <SortTh col="rekening" label="Rekening"/>}
            {!short && <SortTh col="kamar" label="Kamar"/>}
            {!short && <th>Bukti</th>}
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          {sortedData.map(t=>(
            <tr key={t.id}>

// ─── LAPORAN LABA RUGI BULANAN ──────────────────────────────────────────────
function LabaRugiReport({transaksi, aset, bulan, tahun}) {
  const masuk      = transaksi.filter(t=>t.jenis==="Pemasukan");
  const keluar     = transaksi.filter(t=>t.jenis==="Pengeluaran");
  const keluarOps  = keluar.filter(t=>t.kategori!==KATEGORI_BELI_ASET); // pengeluaran operasional saja
  const keluarAset = keluar.filter(t=>t.kategori===KATEGORI_BELI_ASET); // pembelian aset
  const grp = (arr,key) => arr.reduce((a,t)=>{a[t[key]]=(a[t[key]]||0)+t.jumlah;return a},{});
  const pGrp = grp(masuk,"kategori");
  const kGrp = grp(keluarOps,"kategori"); // hanya operasional
  const totM       = masuk.reduce((s,t)=>s+t.jumlah,0);
  const totKTunai  = keluarOps.reduce((s,t)=>s+t.jumlah,0); // tanpa pembelian aset
  const totBeliAsetLR = keluarAset.reduce((s,t)=>s+t.jumlah,0);

  // Filter aset tetap: hanya yang sudah dibeli s/d bulan laporan
  const bln0 = (bulan||1) - 1; // 0-based
  const asetTetap = (aset||[]).filter(a=>{
    if(a.jenis==="lancar") return false;
    if(!a.tanggalBeli) return true;
    const beli = new Date(a.tanggalBeli);
    if(beli.getFullYear() > tahun) return false;
    if(beli.getFullYear() === tahun && beli.getMonth() > bln0) return false;
    return true;
  });

  // Penyusutan per aset: hanya berlaku di bulan laporan (bukan akumulasi)
  const penyAset = (a) => {
    if(!a.penyusutan) return 0;
    if(!a.tanggalBeli) return a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    const beliThn = beli.getFullYear(), beliBln = beli.getMonth();
    if(tahun < beliThn || (tahun===beliThn && bln0 < beliBln)) return 0;
    if(a.usiaPakai > 0) {
      const bulanSejakBeli = (tahun - beliThn)*12 + (bln0 - beliBln);
      if(bulanSejakBeli >= a.usiaPakai) return 0;
    }
    return a.penyusutan;
  };

  const totPenyusutan = asetTetap.reduce((s,a)=>s+penyAset(a),0);
  const totK  = totKTunai + totPenyusutan;
  const laba  = totM - totK;
  const totBebanLabel = totK;
  return (
    <div>
      <div className="report-row header">📈 PENDAPATAN / PEMASUKAN</div>
      {Object.entries(pGrp).map(([k,v])=>(
        <div className="report-row" key={k}>
          <span>{k}</span>
          <div style={{textAlign:"right"}}>
            <div className="amount-pos">{fmt(v)}</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>{totM>0?Math.round(v/totM*100):0}%</div>
          </div>
        </div>
      ))}
      {!Object.keys(pGrp).length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data pemasukan.</div>}
      <div className="report-row subtotal"><span>Total Pendapatan</span><span className="amount-pos">{fmt(totM)}</span></div>

      <div className="report-row header">📉 BEBAN / PENGELUARAN</div>
      {Object.entries(kGrp).map(([k,v])=>(
        <div className="report-row" key={k}>
          <span>{k}</span>
          <div style={{textAlign:"right"}}>
            <div className="amount-neg">{fmt(v)}</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>{totBebanLabel>0?Math.round(v/totBebanLabel*100):0}%</div>
          </div>
        </div>
      ))}
      {!Object.keys(kGrp).length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data pengeluaran.</div>}

      <div className="report-row" style={{borderTop:"1.5px dashed var(--border)",background:"rgba(123,45,62,0.04)",
        display:"flex",justifyContent:"space-between",padding:"10px 16px",alignItems:"center"}}>
        <span style={{fontWeight:700,color:"var(--burgundy)",fontSize:13}}>Subtotal Beban Tunai</span>
        <span style={{fontWeight:700,color:"var(--rose)",fontSize:13}}>{fmt(totKTunai)}</span>
      </div>

      {/* Penyusutan Aset Tetap sebagai beban non-kas */}
      {totPenyusutan>0 && (
        <>
          <div style={{padding:"6px 16px 2px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"var(--gold)",marginTop:4}}>
            Beban Non-Kas
          </div>
          {asetTetap.filter(a=>penyAset(a)>0).map(a=>(
            <div className="report-row" key={a.id}>
              <span style={{color:"var(--text-soft)"}}>
                Penyusutan — {a.nama}
                <span style={{fontSize:11,marginLeft:6,padding:"1px 7px",borderRadius:8,background:"var(--gold-light)",color:"var(--gold)",fontWeight:600}}>non-kas</span>
              </span>
              <div style={{textAlign:"right"}}>
                <div className="amount-neg">{fmt(penyAset(a))}</div>
                <div style={{fontSize:11,color:"var(--text-soft)"}}>{totBebanLabel>0?Math.round(penyAset(a)/totBebanLabel*100):0}%</div>
              </div>
            </div>
          ))}
          <div className="report-row" style={{borderTop:"1px dashed var(--border)",fontSize:13,color:"var(--text-soft)"}}>
            <span>Subtotal Penyusutan</span>
            <span style={{color:"var(--rose)",fontWeight:600}}>{fmt(totPenyusutan)}</span>
          </div>
        </>
      )}

      <div className="report-row subtotal"><span>Total Beban Operasional</span><span className="amount-neg">{fmt(totK)}</span></div>

      {/* Pembelian Aset — bukan beban, hanya info */}
      {totBeliAsetLR > 0 && (<>
        <div className="report-row header" style={{background:"rgba(196,154,90,0.08)",color:"var(--gold)"}}>
          🏛️ PEMBELIAN ASET (Non-Beban)
        </div>
        {keluarAset.map(t=>(
          <div className="report-row" key={t.id} style={{background:"rgba(196,154,90,0.05)"}}>
            <div>
              <div style={{fontWeight:500}}>{t.deskripsi||t.kategori}</div>
              <div style={{fontSize:11,color:"var(--text-soft)"}}>Bukan beban — mengurangi kas, menambah aset tetap</div>
            </div>
            <span style={{color:"var(--gold)",fontWeight:600}}>{fmt(t.jumlah)}</span>
          </div>
        ))}
        <div className="report-row" style={{background:"rgba(196,154,90,0.08)",borderTop:"1px solid var(--gold)"}}>
          <span style={{color:"var(--gold)",fontWeight:600}}>Total Pembelian Aset</span>
          <span style={{color:"var(--gold)",fontWeight:700}}>{fmt(totBeliAsetLR)}</span>
        </div>
      </>)}

      {/* LABA BERSIH AKUNTANSI */}
      <div className="report-row total">
        <span>{laba>=0?"✓ LABA BERSIH AKUNTANSI":"✗ RUGI BERSIH AKUNTANSI"}</span>
        <span>{fmt(Math.abs(laba))}</span>
      </div>

      {/* PPh PASAL 31E — hanya jika ada laba */}
      {laba>0 && (<>
        <div style={{marginTop:12,padding:"6px 16px 2px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#1565C0"}}>
          Pajak Penghasilan
        </div>
        <div className="report-row" style={{background:"rgba(21,101,192,0.05)"}}>
          <div>
            <div style={{fontWeight:500}}>PPh Badan Pasal 31E</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>50% × 22% × {fmt(laba)} = 11% × Laba Bersih Akuntansi</div>
          </div>
          <span style={{fontWeight:600,color:"#1565C0"}}>{fmt(Math.round(laba*0.11))}</span>
        </div>
        <div className="report-row" style={{borderTop:"2px solid #1565C0",background:"linear-gradient(135deg,#1565C0,#0D47A1)",color:"white",fontWeight:700,fontSize:15,borderRadius:8,marginTop:4,fontFamily:"'Playfair Display',serif"}}>
          <span>✓ LABA SETELAH PAJAK</span>
          <span>{fmt(Math.round(laba*0.89))}</span>
        </div>
      </>)}
    </div>
  );
}

// ─── NERACA ─────────────────────────────────────────────────────────────────
function NeracaReport({aset, kewajiban, modalAwal, akumLabaDitahan, labaTahunIni, tahun, bulan, totKwj, modalPemilik}) {
  // SISI AKTIVA
  const nBln0 = (bulan||12) - 1; // bulan neraca 0-based

  // Filter aset tetap: hanya yang sudah dibeli s/d bulan neraca
  const asetTetap = aset.filter(a=>{
    if(a.jenis==="lancar") return false;
    if(!a.tanggalBeli) return true;
    const beli = new Date(a.tanggalBeli);
    if(beli.getFullYear() > tahun) return false;
    if(beli.getFullYear() === tahun && beli.getMonth() > nBln0) return false;
    return true;
  });

  // Hitung akumulasi penyusutan 1 aset s/d bulan neraca (bukan flat /bln)
  const hitungAkumPeny = (a) => {
    if(!a.penyusutan) return 0;
    if(!a.tanggalBeli) return a.penyusutan * (nBln0 + 1);
    const beli = new Date(a.tanggalBeli);
    const beliThn = beli.getFullYear(), beliBln = beli.getMonth();
    let totalBulan = 0;
    for(let thn2=beliThn; thn2<=tahun; thn2++) {
      const blnMulai = thn2===beliThn ? beliBln : 0;
      const blnAkhir = thn2===tahun   ? nBln0   : 11;
      for(let b=blnMulai; b<=blnAkhir; b++) {
        if(a.usiaPakai>0) {
          const sdBeli = (thn2-beliThn)*12+(b-beliBln);
          if(sdBeli >= a.usiaPakai) continue;
        }
        totalBulan++;
      }
    }
    return a.penyusutan * totalBulan;
  };

  const totTetapBruto    = asetTetap.reduce((s,a)=>s+a.nilai,0);
  const totPenyusutan    = asetTetap.reduce((s,a)=>s+hitungAkumPeny(a),0);
  const totTetapBersih   = totTetapBruto - totPenyusutan;
  // PPh Pasal 31E = 11% x laba (hanya jika laba > 0)
  const pph              = labaTahunIni > 0 ? Math.round(labaTahunIni * 0.11) : 0;
  const labaSetelahPajak = labaTahunIni - pph;
  // SISI PASIVA
  const totalEkuitas     = modalAwal + akumLabaDitahan + labaSetelahPajak;
  const totKwjTotal      = totKwj + pph;
  const totPasiva        = totKwjTotal + totalEkuitas;
  // Aset Lancar = Pasiva - Aset Tetap Bersih (selalu seimbang)
  const totLancarNeraca  = totPasiva - totTetapBersih;
  const totAset          = totLancarNeraca + totTetapBersih;

  const rowStyle = {display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 16px",borderRadius:8,fontSize:14};
  const subStyle = {borderTop:"1.5px solid var(--border)",fontWeight:600,color:"var(--burgundy)"};
  const hdrStyle = (bg,color) => ({...rowStyle,background:bg,fontWeight:700,color,fontFamily:"'Playfair Display',serif",fontSize:15,marginBottom:4});
  const R = ({label,val,sub,color,indent,italic}) => (
    <div style={{...rowStyle,paddingLeft:indent?28:16}} onMouseEnter={e=>e.currentTarget.style.background="var(--rose-pale)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
      <div>
        <div style={{fontStyle:italic?"italic":"normal"}}>{label}</div>
        {sub && <div style={{fontSize:11,color:"var(--text-soft)"}}>{sub}</div>}
      </div>
      <span style={{fontWeight:600,color:color||"var(--text)"}}>{fmt(val)}</span>
    </div>
  );

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:32}}>

      {/* ── KOLOM KIRI: AKTIVA ── */}
      <div>
        {/* ASET LANCAR — dihitung otomatis agar neraca seimbang */}
        <div style={hdrStyle("var(--green-light)","var(--green)")}>
          <span>💧 ASET LANCAR</span>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:"var(--white)",color:"var(--green)",fontWeight:700}}>Kas & Setara Kas</span>
        </div>
        <div style={{...rowStyle,background:"rgba(74,124,107,0.05)"}}>
          <div>
            <div style={{fontWeight:500}}>Kas, Bank & Piutang</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>= Total Pasiva − Aset Tetap Bersih</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>= {fmt(totPasiva)} − {fmt(totTetapBersih)}</div>
          </div>
          <span style={{fontWeight:700,color:"var(--green)",fontSize:15}}>{fmt(totLancarNeraca)}</span>
        </div>
        <div style={{...rowStyle,borderTop:"1.5px solid var(--border)",fontWeight:600,color:"var(--burgundy)"}}>
          <span>Jumlah Aset Lancar</span>
          <span style={{color:"var(--green)"}}>{fmt(totLancarNeraca)}</span>
        </div>

        {/* ASET TETAP */}
        <div style={{...hdrStyle("var(--gold-light)","var(--gold)"),marginTop:16}}>
          <span>🏛️ ASET TETAP</span>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:"var(--white)",color:"var(--gold)",fontWeight:700}}>Jangka Panjang</span>
        </div>
        {asetTetap.length===0 && <div style={{padding:"10px 16px",color:"var(--text-soft)",fontSize:13,fontStyle:"italic"}}>Belum ada aset tetap yang dibeli s/d periode ini.</div>}
        {asetTetap.map(a=>{
          const akumPeny = hitungAkumPeny(a);
          const nilBersih = a.nilai - akumPeny;
          return (
            <R key={a.id} label={a.nama} val={a.nilai}
               sub={[
                 a.tanggalBeli?"Beli: "+a.tanggalBeli:"",
                 a.penyusutan>0?"Peny/bln: "+fmt(a.penyusutan):"",
                 akumPeny>0?"Akum. peny: "+fmt(akumPeny):"",
                 "Nilai bersih: "+fmt(nilBersih)
               ].filter(Boolean).join(" · ")} indent/>
          );
        })}

          <span>Total Kewajiban</span>
          <span style={{color:"var(--rose)"}}>{fmt(totKwjTotal)}</span>

          <span>💰 MODAL / EKUITAS</span>
        </div>

        {/* Modal Pemilik — diinput manual */}
        <R label="Modal Pemilik" val={modalPemilik}
           sub={"Setoran modal pemilik (diinput manual) − Kewajiban "+fmt(totKwj)+" = "+fmt(modalAwal)}
           color="var(--burgundy)" indent/>

        {/* Akumulasi Laba Ditahan tahun-tahun sebelumnya */}
        {akumLabaDitahan !== 0 && (
          <R label={"Akumulasi Laba Ditahan s/d "+(tahun-1)} val={akumLabaDitahan}
             sub={"Laba/Rugi kumulatif tahun-tahun sebelum "+tahun}
             color={akumLabaDitahan>=0?"var(--green)":"var(--rose)"} indent/>
        )}

        {/* Laba/Rugi s/d bulan terpilih (setelah pajak) */}
        <R label={"Laba/Rugi s/d "+BULAN[(bulan||12)-1]+" "+tahun} val={labaTahunIni}
           sub={"Laba bersih akuntansi (sebelum pajak)"}
           color={labaTahunIni>=0?"var(--green)":"var(--rose)"} indent/>
        {pph>0 && (
          <R label="(−) PPh Pasal 31E" val={-pph}
             sub={"11% × laba — dipindah ke Utang PPh di Kewajiban"}
             color="#1565C0" indent/>
        )}
        {pph>0 && (
          <R label={"Laba Ditahan (Setelah Pajak)"} val={labaSetelahPajak}
             sub={"Laba bersih setelah PPh 11%"}
             color={labaSetelahPajak>=0?"var(--green)":"var(--rose)"} indent/>
        )}

        <div style={{...rowStyle,...subStyle}}>
          <span>Total Ekuitas</span>
          <span style={{color:"var(--burgundy)",fontWeight:700}}>{fmt(totalEkuitas)}</span>

        {/* TOTAL PASIVA */}
        <div style={{...rowStyle,background:"linear-gradient(135deg,var(--burgundy),#5C1A28)",color:"var(--cream)",fontWeight:700,fontSize:15,marginTop:10,borderRadius:10,fontFamily:"'Playfair Display',serif"}}>
          <span>TOTAL PASIVA</span>
          <span>{fmt(totPasiva)}</span>
        </div>

        {/* INDIKATOR */}

          ✓ Neraca Seimbang — Aktiva = Pasiva = {fmt(totAset)}
        </div>
        {pph>0 && (
          <div style={{marginTop:6,padding:"8px 14px",borderRadius:10,fontSize:11,textAlign:"center",background:"rgba(21,101,192,0.08)",color:"#1565C0",fontWeight:500}}>
            🏛️ Utang PPh 31E {fmt(pph)} masuk Kewajiban · Laba setelah pajak {fmt(labaSetelahPajak)} masuk Ekuitas
          </div>
        )}
      </div>
    </div>
  );
}
// ─── LAPORAN TAHUNAN ─────────────────────────────────────────────────────────
function LabaRugiTahunan({transaksi, aset, jenisLabel}) {
  const tahunList = [...new Set(transaksi.map(t=>new Date(t.tanggal).getFullYear()))].sort((a,b)=>b-a);
  const curYear = new Date().getFullYear();
  const [tahun, setTahun] = useState(tahunList[0]||curYear);
  const [mode, setMode] = useState("ringkasan");

  const dataT    = transaksi.filter(t=>new Date(t.tanggal).getFullYear()===tahun);
  const dataTOps = dataT.filter(t=>t.jenis!=="Pengeluaran"||t.kategori!==KATEGORI_BELI_ASET);
  const katM = [...new Set(dataT.filter(t=>t.jenis==="Pemasukan").map(t=>t.kategori))];
  const katK = [...new Set(dataT.filter(t=>t.jenis==="Pengeluaran"&&t.kategori!==KATEGORI_BELI_ASET).map(t=>t.kategori))];
  const totPerKat = (jenis,kat) => dataT.filter(t=>t.jenis===jenis&&t.kategori===kat).reduce((s,t)=>s+t.jumlah,0);
  const perBulanKat = (jenis,kat,bln) => dataT.filter(t=>t.jenis===jenis&&t.kategori===kat&&new Date(t.tanggal).getMonth()===bln).reduce((s,t)=>s+t.jumlah,0);
  const totBulan = (jenis,bln) => dataT.filter(t=>t.jenis===jenis&&t.kategori!==KATEGORI_BELI_ASET&&new Date(t.tanggal).getMonth()===bln).reduce((s,t)=>s+t.jumlah,0);
  const totM       = dataT.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const totKTunai  = dataT.filter(t=>t.jenis==="Pengeluaran"&&t.kategori!==KATEGORI_BELI_ASET).reduce((s,t)=>s+t.jumlah,0);
  const totBeliAsetThn = dataT.filter(t=>t.jenis==="Pengeluaran"&&t.kategori===KATEGORI_BELI_ASET).reduce((s,t)=>s+t.jumlah,0);

  // Penyusutan per aset per bulan — mulai dari tanggal beli, berhenti setelah usia pakai habis
  const asetTetap = (aset||[]).filter(a=>a.jenis==="tetap"||!a.jenis);
  const penyAsetBln = (a, bln) => {
    if(!a.penyusutan) return 0;
    if(!a.tanggalBeli) return a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    if(tahun < beli.getFullYear()) return 0;
    if(tahun===beli.getFullYear() && bln<beli.getMonth()) return 0;
    if(a.usiaPakai>0) {
      const bulanSejakBeli = (tahun-beli.getFullYear())*12 + (bln-beli.getMonth());
      if(bulanSejakBeli >= a.usiaPakai) return 0; // usia pakai sudah habis
    }
    return a.penyusutan;
  };
  const totPenyBln = (bln) => asetTetap.reduce((s,a)=>s+penyAsetBln(a,bln),0);
  const totPenyusutanTahunan = Array.from({length:12},(_,i)=>totPenyBln(i)).reduce((a,b)=>a+b,0);
  const bulanAktif = new Set(dataT.map(t=>new Date(t.tanggal).getMonth())).size;
  const penyPerBulan = bulanAktif>0 ? Math.round(totPenyusutanTahunan/bulanAktif) : 0;
  const totK      = totKTunai + totPenyusutanTahunan;
  const labaKas   = totM - totKTunai;           // tanpa penyusutan
  const laba      = totM - totK;                // dengan penyusutan (akuntansi)
  // PPh Pasal 31E = 11% × laba akuntansi, hanya jika ada laba
  const pph31e    = laba > 0 ? Math.round(laba * 0.11) : 0;
  const labaSetelahPajak = laba - pph31e;
  // PPh per bulan: 11% × laba akuntansi per bulan (hanya bulan yang ada laba)
  const pphBulan = (bln) => {
    const labaB = totBulan("Pemasukan",bln) - totBulan("Pengeluaran",bln) - totPenyBln(bln);
    return labaB > 0 ? Math.round(labaB * 0.11) : 0;
  };

  const exportCSV = () => {
    const rows = ["Kategori,"+BULAN.join(",")+",TOTAL"];
    rows.push("=== PENDAPATAN ===");
    katM.forEach(kat=>{
      const cols = Array.from({length:12},(_,i)=>perBulanKat("Pemasukan",kat,i));
      rows.push(`"${kat}",`+cols.join(",")+","+cols.reduce((a,b)=>a+b,0));
    });
    rows.push("TOTAL PENDAPATAN,"+Array.from({length:12},(_,i)=>totBulan("Pemasukan",i)).join(",")+","+totM);
    rows.push("=== PENGELUARAN (KAS) ===");
    katK.forEach(kat=>{
      const cols = Array.from({length:12},(_,i)=>perBulanKat("Pengeluaran",kat,i));
      rows.push(`"${kat}",`+cols.join(",")+","+cols.reduce((a,b)=>a+b,0));
    });
    rows.push("=== PENYUSUTAN ASET TETAP ===");
    asetTetap.filter(a=>a.penyusutan>0).forEach(a=>{
      const cols = Array.from({length:12},(_,i)=>penyAsetBln(a,i));
      rows.push(`"Penyusutan - ${a.nama}",`+cols.join(",")+","+cols.reduce((x,y)=>x+y,0));
    });
    rows.push("TOTAL PENGELUARAN+PENYUSUTAN,"+Array.from({length:12},(_,i)=>totBulan("Pengeluaran",i)+totPenyBln(i)).join(",")+","+totK);
    rows.push("LABA/RUGI AKUNTANSI,"+Array.from({length:12},(_,i)=>totBulan("Pemasukan",i)-totBulan("Pengeluaran",i)-totPenyBln(i)).join(",")+","+laba);
    rows.push("PPh PASAL 31E (11%),"+Array.from({length:12},(_,i)=>pphBulan(i)).join(",")+","+pph31e);
    rows.push("LABA SETELAH PAJAK,"+Array.from({length:12},(_,i)=>{const labaB=totBulan("Pemasukan",i)-totBulan("Pengeluaran",i)-totPenyBln(i);return labaB-pphBulan(i);}).join(",")+","+labaSetelahPajak);
    const blob = new Blob([rows.join("\n")],{type:"text/csv"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`LabaRugi_Tahunan_Almarwa_${tahun}.csv`; a.click();
  };

  const thS = {padding:"10px 12px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:"var(--text-soft)",background:"var(--rose-pale)",borderBottom:"1px solid var(--border)",whiteSpace:"nowrap"};
  const tdS = (right,extra) => ({padding:"10px 12px",borderBottom:"1px solid var(--border)",textAlign:right?"right":"left",fontSize:13,...extra});

  const allTahun = [...new Set([curYear, ...tahunList])].sort((a,b)=>b-a);

  return (
    <div>
      <div className="card" style={{padding:"16px 20px",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontWeight:600,fontSize:13,color:"var(--text-soft)"}}>Tahun:</span>
            <select value={tahun} onChange={e=>setTahun(Number(e.target.value))} style={{padding:"7px 12px",fontSize:13}}>
              {allTahun.map(y=><option key={y}>{y}</option>)}
            </select>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {[["ringkasan","📋 Ringkasan"],["detail","🔍 Per Kategori"],["bulanan","📅 Matriks Bulanan"]].map(([v,l])=>(
                <button key={v} onClick={()=>setMode(v)} className={`btn btn-sm ${mode===v?"btn-primary":"btn-secondary"}`}>{l}</button>
              ))}
            </div>
          </div>
          <button className="btn btn-gold btn-sm" onClick={exportCSV}>📥 Export CSV</button>
        </div>
      </div>

      <div className="stat-grid" style={{marginBottom:12}}>
        <div className="stat-card green">
          <div className="stat-label">Total Pendapatan {tahun}</div>
          <div className="stat-value">{fmt(totM)}</div>
          <div className="stat-sub">Rata-rata {fmt(bulanAktif>0?Math.round(totM/bulanAktif):0)}/bln · {bulanAktif} bln aktif</div>
        </div>
        <div className="stat-card rose">
          <div className="stat-label">Total Pengeluaran Kas {tahun}</div>
          <div className="stat-value">{fmt(totKTunai)}</div>
          <div className="stat-sub">Di luar penyusutan · {bulanAktif} bln aktif</div>
        </div>
        <div className={`stat-card ${labaKas>=0?"green":"rose"}`}>
          <div className="stat-label">💵 Laba/Rugi Kas {tahun}</div>
          <div className="stat-value">{fmt(Math.abs(labaKas))}</div>
          <div className="stat-sub">{labaKas>=0?"✓ Untung":"✗ Rugi"} · tanpa penyusutan</div>
        </div>
        <div className={`stat-card ${laba>=0?"green":"rose"}`}>
          <div className="stat-label">📊 Laba/Rugi Akuntansi {tahun}</div>
          <div className="stat-value">{fmt(Math.abs(laba))}</div>
          <div className="stat-sub">{laba>=0?"✓ Untung":"✗ Rugi"} · penyusutan {fmt(totPenyusutanTahunan)}</div>
        </div>
      </div>
      <div className="stat-grid" style={{gridTemplateColumns:"repeat(2,1fr)",marginBottom:20}}>
        <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
          <div className="stat-label" style={{color:"#1565C0"}}>🏛️ PPh Pasal 31E {tahun}</div>
          <div className="stat-value" style={{color:"#1565C0",fontSize:22}}>{fmt(pph31e)}</div>
          <div className="stat-sub">{pph31e>0?"11% × "+fmt(laba)+" (laba akuntansi)":laba<=0?"Tidak ada pajak (rugi)":"—"}</div>
        </div>
        <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
          <div className="stat-label" style={{color:"#1565C0"}}>✅ Laba Setelah Pajak {tahun}</div>
          <div className="stat-value" style={{color:labaSetelahPajak>=0?"var(--green)":"var(--rose)",fontSize:22}}>{fmt(Math.abs(labaSetelahPajak))}</div>
          <div className="stat-sub">{labaSetelahPajak>=0?"✓ Surplus bersih":"✗ Defisit"} · Margin {totM>0?Math.round(labaSetelahPajak/totM*100):0}%</div>
        </div>
      </div>

      {mode==="ringkasan" && (
        <div className="card">
          <div className="card-title">
            📋 Ringkasan Laba Rugi Tahunan {tahun}
            {jenisLabel && <span style={{fontSize:12,marginLeft:8,padding:"2px 10px",borderRadius:8,background:"rgba(123,45,62,0.1)",color:"var(--burgundy)",fontWeight:600}}>{jenisLabel}</span>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
            <div>
              <div className="report-row header">📈 PENDAPATAN</div>
              {katM.map(kat=>{
                const v=totPerKat("Pemasukan",kat);
                return (<div className="report-row" key={kat}>
                  <span>{kat}</span>
                  <div style={{textAlign:"right"}}>
                    <div className="amount-pos">{fmt(v)}</div>
                    <div style={{fontSize:11,color:"var(--text-soft)"}}>{totM>0?Math.round(v/totM*100):0}%</div>
                  </div>
                </div>);
              })}
              {!katM.length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data.</div>}
              <div className="report-row subtotal"><span>Total Pendapatan</span><span className="amount-pos">{fmt(totM)}</span></div>
            </div>
            <div>
              <div className="report-row header">📉 PENGELUARAN</div>
              {katK.map(kat=>{
                const v=totPerKat("Pengeluaran",kat);
                return (<div className="report-row" key={kat}>
                  <span>{kat}</span>
                  <div style={{textAlign:"right"}}>
                    <div className="amount-neg">{fmt(v)}</div>
                    <div style={{fontSize:11,color:"var(--text-soft)"}}>{totK>0?Math.round(v/totK*100):0}%</div>
                  </div>
                </div>);
              })}
              {!katK.length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data.</div>}
              <div className="report-row" style={{borderTop:"1.5px dashed var(--border)",background:"rgba(123,45,62,0.04)",
                display:"flex",justifyContent:"space-between",padding:"10px 16px",alignItems:"center"}}>
                <span style={{fontWeight:700,color:"var(--burgundy)",fontSize:13}}>Subtotal Beban Tunai</span>
                <span style={{fontWeight:700,color:"var(--rose)",fontSize:13}}>{fmt(totKTunai)}</span>
              </div>
              {totPenyusutanTahunan>0 && (<>
                <div style={{padding:"6px 16px 2px",fontSize:11,fontWeight:700,textTransform:"uppercase",
                  letterSpacing:"1px",color:"var(--gold)",marginTop:4}}>Beban Non-Kas</div>
                {asetTetap.filter(a=>totPenyBln(0)>=0).map(a=>{
                  const totalPenyAset=Array.from({length:12},(_,i)=>penyAsetBln(a,i)).reduce((x,y)=>x+y,0);
                  return totalPenyAset>0?(<div className="report-row" key={a.id}>
                    <span style={{color:"var(--text-soft)"}}>Penyusutan — {a.nama}
                      <span style={{fontSize:11,marginLeft:6,padding:"1px 7px",borderRadius:8,
                        background:"var(--gold-light)",color:"var(--gold)",fontWeight:600}}>non-kas</span>
                    </span>
                    <span className="amount-neg">{fmt(totalPenyAset)}</span>
                  </div>):null;
                })}
                <div className="report-row" style={{borderTop:"1px dashed var(--border)",fontSize:13,color:"var(--text-soft)"}}>
                  <span>Subtotal Penyusutan</span>
                  <span style={{color:"var(--rose)",fontWeight:600}}>{fmt(totPenyusutanTahunan)}</span>
                </div>
              </>)}
              <div className="report-row subtotal"><span>Total Beban Operasional</span><span className="amount-neg">{fmt(totK)}</span></div>
            </div>
          </div>
          <div className="report-row total" style={{marginTop:16,background:"linear-gradient(135deg,#2E7D32,#1B5E20)",borderRadius:10}}>
            <span>💵 {labaKas>=0?"LABA KAS (Tanpa Penyusutan)":"RUGI KAS (Tanpa Penyusutan)"}</span>
            <span>{fmt(Math.abs(labaKas))}</span>
          </div>
          <div className="report-row total" style={{marginTop:6,background:"linear-gradient(135deg,var(--burgundy),#5C1A28)",borderRadius:10}}>
            <span>📊 {laba>=0?"LABA AKUNTANSI (Incl. Penyusutan)":"RUGI AKUNTANSI (Incl. Penyusutan)"}</span>
            <span>{fmt(Math.abs(laba))}</span>
          </div>
          {pph31e>0 && (<>
            <div className="report-row" style={{marginTop:6,padding:"10px 16px",background:"rgba(21,101,192,0.08)",borderRadius:8,display:"flex",justifyContent:"space-between",fontSize:14}}>
              <div>
                <div style={{fontWeight:600,color:"#1565C0"}}>🏛️ PPh Badan Pasal 31E</div>

            </div>
          </>)}

                  <th style={thS}>Kategori</th>

                  <th style={{...thS,textAlign:"right"}}>% Kontribusi</th>

                <tfoot>

function GSheetPanel({transaksi, kamar, aset, kewajiban, onLoad, showToast}) {
  const [status,   setStatus]   = React.useState("idle");
  const [signedIn, setSignedIn] = React.useState(false);
  const [lastSync, setLastSync] = React.useState(null);
  const [msg,      setMsg]      = React.useState("");
  const [apiReady, setApiReady] = React.useState(false);

  // Cek API siap setiap 500ms sampai ready
  React.useEffect(()=>{
    const check = setInterval(()=>{
      if(window.gsIsReady && window.gsIsReady()){
        setApiReady(true);
        clearInterval(check);
      }
    }, 500);
    // Timeout 30 detik
    setTimeout(()=>clearInterval(check), 30000);
    return ()=>clearInterval(check);
  },[]);

  React.useEffect(()=>{
    window.addEventListener('gs-signed-in',  ()=>setSignedIn(true));
    window.addEventListener('gs-signed-out', ()=>setSignedIn(false));
  },[]);

  const handleLogin = async () => {
    if(!apiReady){ setStatus("error"); setMsg("Google API masih loading, tunggu beberapa detik lalu coba lagi."); return; }
    setStatus("loading"); setMsg("Menghubungkan ke Google...");
    try {
      await window.gsSignIn();
      setSignedIn(true); setStatus("success"); setMsg("✓ Berhasil login ke Google");
    } catch(e) { setStatus("error"); setMsg("Gagal login: "+String(e)); }
  };

  const handleSave = async () => {
    setStatus("loading"); setMsg("Menyimpan ke Google Sheets...");
    try {
      await window.gsSave({transaksi,kamar,aset,kewajiban});
      setLastSync(new Date().toLocaleString("id-ID"));
      setStatus("success"); setMsg("✓ Data berhasil disimpan ke Google Sheets!");
      showToast("✓ Tersimpan ke Google Sheets!");
    } catch(e) { setStatus("error"); setMsg("Gagal simpan: "+String(e)); }
  };

  const handleLoad = async () => {
    setStatus("loading"); setMsg("Memuat data dari Google Sheets...");
    try {
      const data = await window.gsLoad();
      onLoad(data);
      setLastSync(new Date().toLocaleString("id-ID"));
      setStatus("success"); setMsg("✓ Data berhasil dimuat dari Google Sheets!");
    } catch(e) { setStatus("error"); setMsg("Gagal muat: "+String(e)); }
  };

  const handleLogout = () => {
    try{ window.gsSignOut(); }catch(e){}
    setSignedIn(false); setStatus("idle"); setMsg("");
  };

  return (
    <div>
      {/* Info Google Sheets */}
      <div style={{background:"rgba(21,101,192,0.06)",borderRadius:12,padding:"16px 20px",marginBottom:20,border:"1px solid rgba(21,101,192,0.15)"}}>

            <div style={{fontSize:12,color:"var(--text-soft)"}}>Data disimpan di spreadsheet milik almarwagriyasedjiwa@gmail.com</div>
          </div>
        </div>
        <div style={{fontSize:12,color:"var(--text-soft)",background:"white",borderRadius:8,padding:"8px 12px",fontFamily:"monospace",wordBreak:"break-all"}}>
          ID: 1K3PQqNskDK1BnJYJr0dT8n-tEVWeo8lbIwx1IzpBeFc
        </div>
      </div>

      {/* Status API */}
      <div style={{marginBottom:12,fontSize:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontWeight:600,color:"var(--text-soft)"}}>Google API:</span>
        {apiReady
          ? <span style={{color:"var(--green)",fontWeight:700}}>🟢 Siap</span>
          : <span style={{color:"var(--gold)",fontWeight:700}}>🟡 Loading... (tunggu beberapa detik)</span>
        }
      </div>

      {/* Status pesan */}
      {msg && (
        <div style={{padding:"10px 16px",borderRadius:10,marginBottom:16,fontSize:13,fontWeight:500,
          background:status==="error"?"var(--rose-light)":status==="success"?"var(--green-light)":"var(--gold-light)",
          color:status==="error"?"var(--rose)":status==="success"?"var(--green)":"var(--gold)"}}>
          {status==="loading"?"⏳ ":""}{msg}
        </div>
      )}

      {/* Tombol Aksi */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        {!signedIn ? (
          <button className="btn btn-primary" onClick={handleLogin} disabled={status==="loading"||!apiReady}
            style={{opacity:apiReady?1:0.6}}>
            {apiReady?"🔑 Login Google & Hubungkan Sheets":"⏳ Menunggu Google API..."}
          </button>
        ) : (
          <>
            <button className="btn btn-green" onClick={handleSave} disabled={status==="loading"}>
              ☁️ Simpan ke Google Sheets
            </button>
            <button className="btn btn-secondary" onClick={handleLoad} disabled={status==="loading"}>
              📥 Muat dari Google Sheets
            </button>
            <button className="btn btn-danger btn-sm" onClick={handleLogout}>
              Logout Google
            </button>
          </>
        )}
      </div>

      {/* Status login & last sync */}
      <div style={{display:"flex",gap:16,fontSize:12,color:"var(--text-soft)",flexWrap:"wrap"}}>
        <span>Status: <strong style={{color:signedIn?"var(--green)":"var(--rose)"}}>{signedIn?"🟢 Terhubung":"🔴 Belum login"}</strong></span>
        {lastSync && <span>Terakhir sync: <strong>{lastSync}</strong></span>}
      </div>

      {/* Panduan */}
      <div style={{marginTop:16,background:"var(--gold-light)",borderRadius:10,padding:"12px 16px",fontSize:12,color:"var(--gold)",lineHeight:1.7}}>

        3. Klik <strong>Simpan</strong> setelah input data baru<br/>
        4. Di perangkat lain: Login → klik <strong>Muat</strong> untuk ambil data terbaru<br/>
        5. Data tersimpan di tab Sheets: Transaksi, Kamar, Aset, Kewajiban
      </div>
    </div>
  );
}
