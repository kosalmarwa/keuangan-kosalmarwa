  <script>
    // ─── KONFIGURASI GOOGLE SHEETS ───────────────────────────────────────────
    const GS_CLIENT_ID    = '895565907296-5n6shrl9cl45e1blap73bfduuqasl6sh.apps.googleusercontent.com';
    const GS_API_KEY      = 'AIzaSyCnB90Cfay49siCRp1UpS5HAZ9h7HfuAII';
    const GS_SPREADSHEET  = '1K3PQqNskDK1BnJYJr0dT8n-tEVWeo8lbIwx1IzpBeFc';
    const GS_SCOPE        = 'https://www.googleapis.com/auth/spreadsheets';
    const GS_DISCOVERY    = 'https://sheets.googleapis.com/$discovery/rest?version=v4';

    let gsTokenClient = null;
    let gsGapiReady   = false;
    let gsGsiReady    = false;
    let gsSignedIn    = false;

    // Load GAPI client
    window.gapiLoaded = function() {
      gapi.load('client', async () => {
        await gapi.client.init({ apiKey: GS_API_KEY, discoveryDocs: [GS_DISCOVERY] });
        gsGapiReady = true;
      });
    };

    // Load GSI (Google Sign-In)
    window.gsiLoaded = function() {
      gsTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GS_CLIENT_ID,
        scope: GS_SCOPE,
        callback: (resp) => {
          if(resp.error) { console.error(resp); return; }
          gsSignedIn = true;
          window.dispatchEvent(new Event('gs-signed-in'));
        },
      });
      gsGsiReady = true;
    };

    // Sign In
    window.gsSignIn = () => new Promise((resolve, reject) => {
      if(gsSignedIn){ resolve(); return; }
      if(!gsGapiReady || !gsGsiReady){ reject('Google API belum siap'); return; }
      window.addEventListener('gs-signed-in', () => resolve(), { once: true });
      gsTokenClient.requestAccessToken({ prompt: 'consent' });
    });

    // Sign Out
    window.gsSignOut = () => {
      google.accounts.oauth2.revoke(gapi.client.getToken().access_token, ()=>{
        gapi.client.setToken('');
        gsSignedIn = false;
        window.dispatchEvent(new Event('gs-signed-out'));
      });
    };

    // Simpan semua data ke Google Sheets
    window.gsSave = async (data) => {
      await window.gsSignIn();
      const sheets = [
        { name:'Transaksi',   rows: data.transaksi,  headers:['id','tanggal','jenis','kategori','deskripsi','jumlah','kamar','rekening'] },
        { name:'Kamar',       rows: data.kamar,      headers:['id','nomor','penghuni','harga','status','masuk','akhirSewa'] },
        { name:'Aset',        rows: data.aset,       headers:['id','nama','nilai','penyusutan','jenis','keterangan','tanggalBeli','usiaPakai'] },
        { name:'Kewajiban',   rows: data.kewajiban,  headers:['id','nama','jumlah','cicilan'] },
      ];
      // Bersihkan dan isi ulang setiap sheet
      for(const s of sheets){
        const values = [s.headers, ...s.rows.map(r => s.headers.map(h => {
          const v = r[h];
          return v === null || v === undefined ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
        }))];
        // Clear dulu. Catatan: object dari gapi.client tidak selalu punya .catch(),
        // jadi gunakan try/catch biasa agar tidak muncul error: .catch is not a function.
        try {
          await gapi.client.sheets.spreadsheets.values.clear({
            spreadsheetId: GS_SPREADSHEET,
            range: `${s.name}!A:Z`,
          });
        } catch (err) {
          console.warn(`Gagal clear sheet ${s.name}, lanjut update:`, err);
        }
        // Update
        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: GS_SPREADSHEET,
          range: `${s.name}!A1`,
          valueInputOption: 'RAW',
          resource: { values },
        });
      }
      return true;
    };

    // Muat semua data dari Google Sheets
    window.gsLoad = async () => {
      await window.gsSignIn();
      const sheetNames = ['Transaksi','Kamar','Aset','Kewajiban'];
      const result = {};
      for(const name of sheetNames){
        let resp;
        try {
          resp = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: GS_SPREADSHEET,
            range: name,
          });
        } catch (err) {
          console.warn(`Gagal membaca sheet ${name}:`, err);
          resp = { result: { values: [] } };
        }
        const rows = resp.result.values || [];
        if(rows.length < 2){ result[name.toLowerCase()] = []; continue; }
        const headers = rows[0];
        result[name.toLowerCase()] = rows.slice(1).map(row => {
          const obj = {};
          headers.forEach((h,i) => {
            const v = row[i] || '';
            // Konversi tipe data
            if(['id','jumlah','harga','penyusutan','cicilan','nilai','usiaPakai'].includes(h))
              obj[h] = v === '' ? 0 : Number(v);
            else obj[h] = v;
          });
          return obj;
        });
      }
      return result;
    };

    window.gsIsReady = () => gsGapiReady && gsGsiReady;
    window.gsIsSignedIn = () => gsSignedIn;
  </script>

                </span>
              </td>}
              {!short && <td>{t.kamar?<span className="tag">Kamar {t.kamar}</span>:"-"}</td>}
              {!short && <td style={{textAlign:"center"}}>
                {t.bukti ? (
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>

                        onMouseLeave={e=>e.target.style.transform="scale(1)"}
                        onClick={()=>setViewBukti({src:t.bukti,nama:t.buktiNama})}
                        title="Klik untuk lihat bukti"/>
                    ) : (
                      <div style={{width:44,height:44,borderRadius:6,border:"2px solid var(--gold)",
                        background:"var(--gold-light)",display:"flex",alignItems:"center",
                        justifyContent:"center",fontSize:22,cursor:"pointer"}}
                        onClick={()=>setViewBukti({src:t.bukti,nama:t.buktiNama,isPdf:true})}

                    )}
                    <span style={{fontSize:10,color:"var(--text-soft)",maxWidth:64,
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}

                  <span style={{fontSize:11,color:"var(--border)"}}>—</span>
                )}
              </td>}
              <td>
                <div className="actions">
                  <button className="btn btn-secondary btn-sm" onClick={()=>onEdit&&onEdit(t)}>✏️</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>onDelete(t.id)}>✕</button>
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>

    {/* MODAL VIEWER BUKTI */}
    {viewBukti && (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:500,
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:20,animation:"fadeIn .2s"}}
        onClick={()=>setViewBukti(null)}>
        <div style={{position:"relative",maxWidth:"90vw",maxHeight:"90vh",display:"flex",flexDirection:"column",alignItems:"center",gap:12}}
          onClick={e=>e.stopPropagation()}>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",gap:12,width:"100%",justifyContent:"space-between"}}>
            <span style={{color:"white",fontSize:14,fontWeight:600,maxWidth:300,
              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              📎 {viewBukti.nama||"Bukti Transaksi"}

            <div style={{display:"flex",gap:8}}>
              <a href={viewBukti.src} download={viewBukti.nama||"bukti"}

                📥 Download

                style={{padding:"6px 14px",borderRadius:8,background:"rgba(255,255,255,0.2)",
                  color:"white",border:"none",fontSize:14,cursor:"pointer",fontWeight:700}}>
                ✕ Tutup
              </button>
            </div>
          </div>
          {/* Konten */}
          {viewBukti.isPdf ? (
            <div style={{background:"white",borderRadius:12,padding:32,textAlign:"center"}}>
              <div style={{fontSize:64,marginBottom:16}}>📄</div>
              <div style={{fontSize:15,fontWeight:600,color:"var(--burgundy)",marginBottom:8}}>

              <div style={{fontSize:13,color:"var(--text-soft)",marginBottom:16}}>

              <a href={viewBukti.src} download={viewBukti.nama||"bukti"}

          <div style={{color:"rgba(255,255,255,0.5)",fontSize:11}}>Klik di luar gambar atau ✕ untuk menutup</div>

    </>
  );
}

// ─── LAPORAN LABA RUGI BULANAN ──────────────────────────────────────────────
function LabaRugiReport({transaksi, aset}) {
  const masuk  = transaksi.filter(t=>t.jenis==="Pemasukan");
  const keluar = transaksi.filter(t=>t.jenis==="Pengeluaran");
  const grp = (arr,key) => arr.reduce((a,t)=>{a[t[key]]=(a[t[key]]||0)+t.jumlah;return a},{});
  const pGrp = grp(masuk,"kategori"), kGrp = grp(keluar,"kategori");
  const totM  = masuk.reduce((s,t)=>s+t.jumlah,0);
  const totKTunai = keluar.reduce((s,t)=>s+t.jumlah,0);
  // Penyusutan aset tetap = beban non-kas per bulan
  const asetTetap = (aset||[]).filter(a=>a.jenis==="tetap"||!a.jenis);
  const totPenyusutan = asetTetap.reduce((s,a)=>s+(a.penyusutan||0),0);
  const totK  = totKTunai + totPenyusutan;
  const laba  = totM - totK;
  const totBebanLabel = totK; // untuk hitung persentase
  return (
    <div>
      <div className="report-row header">📈 PENDAPATAN / PEMASUKAN</div>
      {Object.entries(pGrp).map(([k,v])=>(
        <div className="report-row" key={k}>
          <span>{k}</span>
          <div style={{textAlign:"right"}}>
            <div className="amount-pos">{fmt(v)}</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>{totM>0?Math.round(v/totM*100):0}%</div>
          </div>
        </div>
      ))}
      {!Object.keys(pGrp).length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data pemasukan.</div>}
      <div className="report-row subtotal"><span>Total Pendapatan</span><span className="amount-pos">{fmt(totM)}</span></div>

      <div className="report-row header">📉 BEBAN / PENGELUARAN</div>
      {Object.entries(kGrp).map(([k,v])=>(
        <div className="report-row" key={k}>
          <span>{k}</span>
          <div style={{textAlign:"right"}}>
            <div className="amount-neg">{fmt(v)}</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>{totBebanLabel>0?Math.round(v/totBebanLabel*100):0}%</div>
          </div>
        </div>
      ))}
      {!Object.keys(kGrp).length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data pengeluaran.</div>}

      {/* Penyusutan Aset Tetap sebagai beban non-kas */}
      {totPenyusutan>0 && (
        <>
          <div style={{padding:"6px 16px 2px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"var(--gold)",marginTop:4}}>
            Beban Non-Kas
          </div>
          {asetTetap.filter(a=>a.penyusutan>0).map(a=>(
            <div className="report-row" key={a.id}>
              <span style={{color:"var(--text-soft)"}}>
                Penyusutan — {a.nama}
                <span style={{fontSize:11,marginLeft:6,padding:"1px 7px",borderRadius:8,background:"var(--gold-light)",color:"var(--gold)",fontWeight:600}}>non-kas</span>
              </span>
              <div style={{textAlign:"right"}}>
                <div className="amount-neg">{fmt(a.penyusutan)}</div>
                <div style={{fontSize:11,color:"var(--text-soft)"}}>{totBebanLabel>0?Math.round(a.penyusutan/totBebanLabel*100):0}%</div>
              </div>
            </div>
          ))}
          <div className="report-row" style={{borderTop:"1px dashed var(--border)",fontSize:13,color:"var(--text-soft)"}}>
            <span>Subtotal Penyusutan</span>
            <span style={{color:"var(--rose)",fontWeight:600}}>{fmt(totPenyusutan)}</span>
          </div>
        </>
      )}

      <div className="report-row subtotal"><span>Total Beban</span><span className="amount-neg">{fmt(totK)}</span></div>

      {/* LABA BERSIH AKUNTANSI */}
      <div className="report-row total">
        <span>{laba>=0?"✓ LABA BERSIH AKUNTANSI":"✗ RUGI BERSIH AKUNTANSI"}</span>
        <span>{fmt(Math.abs(laba))}</span>
      </div>

      {/* PPh PASAL 31E — hanya jika ada laba */}
      {laba>0 && (<>
        <div style={{marginTop:12,padding:"6px 16px 2px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#1565C0"}}>
          Pajak Penghasilan
        </div>
        <div className="report-row" style={{background:"rgba(21,101,192,0.05)"}}>
          <div>
            <div style={{fontWeight:500}}>PPh Badan Pasal 31E</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>50% × 22% × {fmt(laba)} = 11% × Laba Bersih Akuntansi</div>
          </div>
          <span style={{fontWeight:600,color:"#1565C0"}}>{fmt(Math.round(laba*0.11))}</span>
        </div>
        <div className="report-row" style={{borderTop:"2px solid #1565C0",background:"linear-gradient(135deg,#1565C0,#0D47A1)",color:"white",fontWeight:700,fontSize:15,borderRadius:8,marginTop:4,fontFamily:"'Playfair Display',serif"}}>
          <span>✓ LABA SETELAH PAJAK</span>
          <span>{fmt(Math.round(laba*0.89))}</span>
        </div>
      </>)}
    </div>
  );
}

// ─── NERACA ─────────────────────────────────────────────────────────────────
function NeracaReport({aset, kewajiban, modalAwal, akumLabaDitahan, labaTahunIni, tahun, bulan, totAsetTetapBruto, totKwj}) {
  // SISI AKTIVA
  const asetLancarDetail = aset.filter(a=>a.jenis==="lancar");
  const asetTetap        = aset.filter(a=>a.jenis==="tetap"||!a.jenis);
  const totTetapBruto    = asetTetap.reduce((s,a)=>s+a.nilai,0);
  const totPenyusutan    = asetTetap.reduce((s,a)=>s+(a.penyusutan||0),0);
  const totTetapBersih   = totTetapBruto - totPenyusutan;
  // PPh Pasal 31E = 11% × laba (hanya jika laba > 0)
  const pph              = labaTahunIni > 0 ? Math.round(labaTahunIni * 0.11) : 0;
  const labaSetelahPajak = labaTahunIni - pph;
  // SISI PASIVA
  const totalEkuitas     = modalAwal + akumLabaDitahan + labaSetelahPajak;
  const totPasivaSebelumPPh = totKwj + totalEkuitas;
  const totKwjTotal      = totKwj + pph; // kewajiban + utang PPh
  const totPasiva        = totKwjTotal + totalEkuitas;
  // Aset Lancar = Pasiva - Aset Tetap Bersih → neraca selalu seimbang
  const totLancarNeraca  = totPasiva - totTetapBersih;
  const totAset          = totLancarNeraca + totTetapBersih;

  const rowStyle = {display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 16px",borderRadius:8,fontSize:14};
  const subStyle = {borderTop:"1.5px solid var(--border)",fontWeight:600,color:"var(--burgundy)"};
  const hdrStyle = (bg,color) => ({...rowStyle,background:bg,fontWeight:700,color,fontFamily:"'Playfair Display',serif",fontSize:15,marginBottom:4});
  const R = ({label,val,sub,color,indent,italic}) => (
    <div style={{...rowStyle,paddingLeft:indent?28:16}} onMouseEnter={e=>e.currentTarget.style.background="var(--rose-pale)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
      <div>
        <div style={{fontStyle:italic?"italic":"normal"}}>{label}</div>
        {sub && <div style={{fontSize:11,color:"var(--text-soft)"}}>{sub}</div>}
      </div>
      <span style={{fontWeight:600,color:color||"var(--text)"}}>{fmt(val)}</span>
    </div>
  );

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:32}}>

      {/* ── KOLOM KIRI: AKTIVA ── */}
      <div>
        {/* ASET LANCAR — dihitung otomatis agar neraca seimbang */}
        <div style={hdrStyle("var(--green-light)","var(--green)")}>
          <span>💧 ASET LANCAR</span>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:"var(--white)",color:"var(--green)",fontWeight:700}}>Kas & Setara Kas</span>
        </div>
        <div style={{...rowStyle,background:"rgba(74,124,107,0.05)"}}>
          <div>
            <div style={{fontWeight:500}}>Kas, Bank & Piutang</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>= Total Pasiva − Aset Tetap Bersih</div>
            <div style={{fontSize:11,color:"var(--text-soft)"}}>= {fmt(totPasiva)} − {fmt(totTetapBersih)}</div>
          </div>
          <span style={{fontWeight:700,color:"var(--green)",fontSize:15}}>{fmt(totLancarNeraca)}</span>
        </div>
        <div style={{...rowStyle,borderTop:"1.5px solid var(--border)",fontWeight:600,color:"var(--burgundy)"}}>
          <span>Jumlah Aset Lancar</span>
          <span style={{color:"var(--green)"}}>{fmt(totLancarNeraca)}</span>
        </div>

        {/* ASET TETAP */}
        <div style={{...hdrStyle("var(--gold-light)","var(--gold)"),marginTop:16}}>
          <span>🏛️ ASET TETAP</span>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:"var(--white)",color:"var(--gold)",fontWeight:700}}>Jangka Panjang</span>
        </div>
        {asetTetap.length===0 && <div style={{padding:"10px 16px",color:"var(--text-soft)",fontSize:13,fontStyle:"italic"}}>Belum ada aset tetap.</div>}
        {asetTetap.map(a=>(
          <R key={a.id} label={a.nama} val={a.nilai}
             sub={"Penyusutan: "+fmt(a.penyusutan||0)+"/bln"+(a.tanggalBeli?" · Beli: "+a.tanggalBeli:"")+(a.keterangan?" · "+a.keterangan:"")} indent/>
        ))}
        <div style={{...rowStyle,borderTop:"1px dashed var(--border)",color:"var(--text-soft)",fontSize:13}}>
          <span>Akumulasi Penyusutan</span>
          <span style={{color:"var(--rose)",fontWeight:600}}>({fmt(totPenyusutan)})</span>
        </div>
        <div style={{...rowStyle,...subStyle}}>
          <span>Jumlah Aset Tetap (Bersih)</span>
          <span style={{color:"var(--burgundy)"}}>{fmt(totTetapBersih)}</span>
        </div>

        {/* TOTAL AKTIVA */}
        <div style={{...rowStyle,background:"linear-gradient(135deg,var(--burgundy),#5C1A28)",color:"var(--cream)",fontWeight:700,fontSize:15,marginTop:10,borderRadius:10,fontFamily:"'Playfair Display',serif"}}>
          <span>TOTAL AKTIVA</span>
          <span>{fmt(totAset)}</span>
        </div>
      </div>

      {/* ── KOLOM KANAN: PASIVA ── */}
      <div>
        {/* KEWAJIBAN */}
        <div style={hdrStyle("var(--rose-pale)","var(--burgundy)")}>
          <span>📋 KEWAJIBAN</span>
        </div>
        {kewajiban.length===0 && pph===0 && <div style={{padding:"10px 16px",color:"var(--text-soft)",fontSize:13,fontStyle:"italic"}}>Tidak ada kewajiban.</div>}
        {kewajiban.map(k=>(
          <R key={k.id} label={k.nama} val={k.jumlah}
             sub={k.cicilan>0?"Cicilan: "+fmt(k.cicilan)+"/bln":null} color="var(--rose)" indent/>
        ))}
        {/* Utang PPh Pasal 31E */}
        {pph>0 && (
          <R label="Utang PPh Pasal 31E" val={pph}
             sub={"11% × "+fmt(labaTahunIni)+" (laba s/d "+BULAN[(bulan||12)-1]+" "+tahun+")"}
             color="#1565C0" indent/>
        )}
        <div style={{...rowStyle,...subStyle}}>
          <span>Total Kewajiban</span>
          <span style={{color:"var(--rose)"}}>{fmt(totKwjTotal)}</span>
        </div>

        {/* MODAL / EKUITAS */}
        <div style={{...hdrStyle("var(--rose-pale)","var(--burgundy)"),marginTop:16}}>
          <span>💰 MODAL / EKUITAS</span>
        </div>

        {/* Modal Awal: otomatis dari Aset Tetap Bruto - Kewajiban */}
        <R label="Modal Awal" val={modalAwal}
           sub={"Aset Tetap Bruto ("+fmt(totAsetTetapBruto)+") − Kewajiban ("+fmt(totKwj)+")"}
           indent/>

        {/* Akumulasi Laba Ditahan tahun-tahun sebelumnya */}
        {akumLabaDitahan !== 0 && (
          <R label={"Akumulasi Laba Ditahan s/d "+(tahun-1)} val={akumLabaDitahan}
             sub={"Laba/Rugi kumulatif tahun-tahun sebelum "+tahun}
             color={akumLabaDitahan>=0?"var(--green)":"var(--rose)"} indent/>
        )}

        {/* Laba/Rugi s/d bulan terpilih (setelah pajak) */}
        <R label={"Laba/Rugi s/d "+BULAN[(bulan||12)-1]+" "+tahun} val={labaTahunIni}
           sub={"Laba bersih akuntansi (sebelum pajak)"}
           color={labaTahunIni>=0?"var(--green)":"var(--rose)"} indent/>
        {pph>0 && (
          <R label="(−) PPh Pasal 31E" val={-pph}
             sub={"11% × laba — dipindah ke Utang PPh di Kewajiban"}
             color="#1565C0" indent/>
        )}
        {pph>0 && (
          <R label={"Laba Ditahan (Setelah Pajak)"} val={labaSetelahPajak}
             sub={"Laba bersih setelah PPh 11%"}
             color={labaSetelahPajak>=0?"var(--green)":"var(--rose)"} indent/>
        )}

        <div style={{...rowStyle,...subStyle}}>
          <span>Total Ekuitas</span>
          <span style={{color:"var(--burgundy)",fontWeight:700}}>{fmt(totalEkuitas)}</span>
        </div>

        {/* TOTAL PASIVA */}
        <div style={{...rowStyle,background:"linear-gradient(135deg,var(--burgundy),#5C1A28)",color:"var(--cream)",fontWeight:700,fontSize:15,marginTop:10,borderRadius:10,fontFamily:"'Playfair Display',serif"}}>
          <span>TOTAL PASIVA</span>
          <span>{fmt(totPasiva)}</span>
        </div>

        {/* INDIKATOR */}
        <div style={{marginTop:10,padding:"10px 14px",borderRadius:10,fontSize:12,textAlign:"center",background:"var(--green-light)",color:"var(--green)",fontWeight:600}}>
          ✓ Neraca Seimbang — Aktiva = Pasiva = {fmt(totAset)}
        </div>
        {pph>0 && (
          <div style={{marginTop:6,padding:"8px 14px",borderRadius:10,fontSize:11,textAlign:"center",background:"rgba(21,101,192,0.08)",color:"#1565C0",fontWeight:500}}>
            🏛️ Utang PPh 31E {fmt(pph)} masuk Kewajiban · Laba setelah pajak {fmt(labaSetelahPajak)} masuk Ekuitas
          </div>
        )}
      </div>
    </div>
  );
}
// ─── LAPORAN TAHUNAN ─────────────────────────────────────────────────────────
function LabaRugiTahunan({transaksi, aset, jenisLabel}) {
  const tahunList = [...new Set(transaksi.map(t=>new Date(t.tanggal).getFullYear()))].sort((a,b)=>b-a);
  const curYear = new Date().getFullYear();
  const [tahun, setTahun] = useState(tahunList[0]||curYear);
  const [mode, setMode] = useState("ringkasan");

  const dataT = transaksi.filter(t=>new Date(t.tanggal).getFullYear()===tahun);
  const katM = [...new Set(dataT.filter(t=>t.jenis==="Pemasukan").map(t=>t.kategori))];
  const katK = [...new Set(dataT.filter(t=>t.jenis==="Pengeluaran").map(t=>t.kategori))];
  const totPerKat = (jenis,kat) => dataT.filter(t=>t.jenis===jenis&&t.kategori===kat).reduce((s,t)=>s+t.jumlah,0);
  const perBulanKat = (jenis,kat,bln) => dataT.filter(t=>t.jenis===jenis&&t.kategori===kat&&new Date(t.tanggal).getMonth()===bln).reduce((s,t)=>s+t.jumlah,0);
  const totBulan = (jenis,bln) => dataT.filter(t=>t.jenis===jenis&&new Date(t.tanggal).getMonth()===bln).reduce((s,t)=>s+t.jumlah,0);
  const totM = dataT.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const totKTunai = dataT.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);

  // Penyusutan per aset per bulan — mulai dari tanggal beli, berhenti setelah usia pakai habis
  const asetTetap = (aset||[]).filter(a=>a.jenis==="tetap"||!a.jenis);
  const penyAsetBln = (a, bln) => {
    if(!a.penyusutan) return 0;
    if(!a.tanggalBeli) return a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    if(tahun < beli.getFullYear()) return 0;
    if(tahun===beli.getFullYear() && bln<beli.getMonth()) return 0;
    if(a.usiaPakai>0) {
      const bulanSejakBeli = (tahun-beli.getFullYear())*12 + (bln-beli.getMonth());
      if(bulanSejakBeli >= a.usiaPakai) return 0; // usia pakai sudah habis
    }
    return a.penyusutan;
  };
  const totPenyBln = (bln) => asetTetap.reduce((s,a)=>s+penyAsetBln(a,bln),0);
  const totPenyusutanTahunan = Array.from({length:12},(_,i)=>totPenyBln(i)).reduce((a,b)=>a+b,0);
  const bulanAktif = new Set(dataT.map(t=>new Date(t.tanggal).getMonth())).size;
  const penyPerBulan = bulanAktif>0 ? Math.round(totPenyusutanTahunan/bulanAktif) : 0;
  const totK      = totKTunai + totPenyusutanTahunan;
  const labaKas   = totM - totKTunai;           // tanpa penyusutan
  const laba      = totM - totK;                // dengan penyusutan (akuntansi)
  // PPh Pasal 31E = 11% × laba akuntansi, hanya jika ada laba
  const pph31e    = laba > 0 ? Math.round(laba * 0.11) : 0;
  const labaSetelahPajak = laba - pph31e;
  // PPh per bulan: 11% × laba akuntansi per bulan (hanya bulan yang ada laba)
  const pphBulan = (bln) => {
    const labaB = totBulan("Pemasukan",bln) - totBulan("Pengeluaran",bln) - totPenyBln(bln);
    return labaB > 0 ? Math.round(labaB * 0.11) : 0;
  };

  const exportCSV = () => {
    const rows = ["Kategori,"+BULAN.join(",")+",TOTAL"];
    rows.push("=== PENDAPATAN ===");
    katM.forEach(kat=>{
      const cols = Array.from({length:12},(_,i)=>perBulanKat("Pemasukan",kat,i));
      rows.push(`"${kat}",`+cols.join(",")+","+cols.reduce((a,b)=>a+b,0));
    });
    rows.push("TOTAL PENDAPATAN,"+Array.from({length:12},(_,i)=>totBulan("Pemasukan",i)).join(",")+","+totM);
    rows.push("=== PENGELUARAN (KAS) ===");
    katK.forEach(kat=>{
      const cols = Array.from({length:12},(_,i)=>perBulanKat("Pengeluaran",kat,i));
      rows.push(`"${kat}",`+cols.join(",")+","+cols.reduce((a,b)=>a+b,0));
    });
    rows.push("=== PENYUSUTAN ASET TETAP ===");
    asetTetap.filter(a=>a.penyusutan>0).forEach(a=>{
      const cols = Array.from({length:12},(_,i)=>penyAsetBln(a,i));
      rows.push(`"Penyusutan - ${a.nama}",`+cols.join(",")+","+cols.reduce((x,y)=>x+y,0));
    });
    rows.push("TOTAL PENGELUARAN+PENYUSUTAN,"+Array.from({length:12},(_,i)=>totBulan("Pengeluaran",i)+totPenyBln(i)).join(",")+","+totK);
    rows.push("LABA/RUGI AKUNTANSI,"+Array.from({length:12},(_,i)=>totBulan("Pemasukan",i)-totBulan("Pengeluaran",i)-totPenyBln(i)).join(",")+","+laba);
    rows.push("PPh PASAL 31E (11%),"+Array.from({length:12},(_,i)=>pphBulan(i)).join(",")+","+pph31e);
    rows.push("LABA SETELAH PAJAK,"+Array.from({length:12},(_,i)=>{const labaB=totBulan("Pemasukan",i)-totBulan("Pengeluaran",i)-totPenyBln(i);return labaB-pphBulan(i);}).join(",")+","+labaSetelahPajak);
    const blob = new Blob([rows.join("\n")],{type:"text/csv"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`LabaRugi_Tahunan_Almarwa_${tahun}.csv`; a.click();
  };

  const thS = {padding:"10px 12px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".8px",color:"var(--text-soft)",background:"var(--rose-pale)",borderBottom:"1px solid var(--border)",whiteSpace:"nowrap"};
  const tdS = (right,extra) => ({padding:"10px 12px",borderBottom:"1px solid var(--border)",textAlign:right?"right":"left",fontSize:13,...extra});

  const allTahun = [...new Set([curYear, ...tahunList])].sort((a,b)=>b-a);

  return (
    <div>
      <div className="card" style={{padding:"16px 20px",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontWeight:600,fontSize:13,color:"var(--text-soft)"}}>Tahun:</span>
            <select value={tahun} onChange={e=>setTahun(Number(e.target.value))} style={{padding:"7px 12px",fontSize:13}}>
              {allTahun.map(y=><option key={y}>{y}</option>)}
            </select>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {[["ringkasan","📋 Ringkasan"],["detail","🔍 Per Kategori"],["bulanan","📅 Matriks Bulanan"]].map(([v,l])=>(
                <button key={v} onClick={()=>setMode(v)} className={`btn btn-sm ${mode===v?"btn-primary":"btn-secondary"}`}>{l}</button>
              ))}
            </div>
          </div>
          <button className="btn btn-gold btn-sm" onClick={exportCSV}>📥 Export CSV</button>
        </div>
      </div>

      <div className="stat-grid" style={{marginBottom:12}}>
        <div className="stat-card green">
          <div className="stat-label">Total Pendapatan {tahun}</div>
          <div className="stat-value">{fmt(totM)}</div>
          <div className="stat-sub">Rata-rata {fmt(bulanAktif>0?Math.round(totM/bulanAktif):0)}/bln · {bulanAktif} bln aktif</div>
        </div>
        <div className="stat-card rose">
          <div className="stat-label">Total Pengeluaran Kas {tahun}</div>
          <div className="stat-value">{fmt(totKTunai)}</div>
          <div className="stat-sub">Di luar penyusutan · {bulanAktif} bln aktif</div>
        </div>
        <div className={`stat-card ${labaKas>=0?"green":"rose"}`}>
          <div className="stat-label">💵 Laba/Rugi Kas {tahun}</div>
          <div className="stat-value">{fmt(Math.abs(labaKas))}</div>
          <div className="stat-sub">{labaKas>=0?"✓ Untung":"✗ Rugi"} · tanpa penyusutan</div>
        </div>
        <div className={`stat-card ${laba>=0?"green":"rose"}`}>
          <div className="stat-label">📊 Laba/Rugi Akuntansi {tahun}</div>
          <div className="stat-value">{fmt(Math.abs(laba))}</div>
          <div className="stat-sub">{laba>=0?"✓ Untung":"✗ Rugi"} · penyusutan {fmt(totPenyusutanTahunan)}</div>
        </div>
      </div>
      <div className="stat-grid" style={{gridTemplateColumns:"repeat(2,1fr)",marginBottom:20}}>
        <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
          <div className="stat-label" style={{color:"#1565C0"}}>🏛️ PPh Pasal 31E {tahun}</div>
          <div className="stat-value" style={{color:"#1565C0",fontSize:22}}>{fmt(pph31e)}</div>
          <div className="stat-sub">{pph31e>0?"11% × "+fmt(laba)+" (laba akuntansi)":laba<=0?"Tidak ada pajak (rugi)":"—"}</div>
        </div>
        <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
          <div className="stat-label" style={{color:"#1565C0"}}>✅ Laba Setelah Pajak {tahun}</div>
          <div className="stat-value" style={{color:labaSetelahPajak>=0?"var(--green)":"var(--rose)",fontSize:22}}>{fmt(Math.abs(labaSetelahPajak))}</div>
          <div className="stat-sub">{labaSetelahPajak>=0?"✓ Surplus bersih":"✗ Defisit"} · Margin {totM>0?Math.round(labaSetelahPajak/totM*100):0}%</div>
        </div>
      </div>

      {mode==="ringkasan" && (
        <div className="card">
          <div className="card-title">
            📋 Ringkasan Laba Rugi Tahunan {tahun}
            {jenisLabel && <span style={{fontSize:12,marginLeft:8,padding:"2px 10px",borderRadius:8,background:"rgba(123,45,62,0.1)",color:"var(--burgundy)",fontWeight:600}}>{jenisLabel}</span>}

              {!katK.length && <div style={{padding:"12px 16px",color:"var(--text-soft)",fontSize:13}}>Tidak ada data.</div>}
              <div className="report-row subtotal"><span>Total Pengeluaran</span><span className="amount-neg">{fmt(totK)}</span></div>
            </div>
          </div>
          <div className="report-row total" style={{marginTop:16,background:"linear-gradient(135deg,#2E7D32,#1B5E20)",borderRadius:10}}>
            <span>💵 {labaKas>=0?"LABA KAS (Tanpa Penyusutan)":"RUGI KAS (Tanpa Penyusutan)"}</span>
            <span>{fmt(Math.abs(labaKas))}</span>
          </div>
          <div className="report-row total" style={{marginTop:6,background:"linear-gradient(135deg,var(--burgundy),#5C1A28)",borderRadius:10}}>
            <span>📊 {laba>=0?"LABA AKUNTANSI (Incl. Penyusutan)":"RUGI AKUNTANSI (Incl. Penyusutan)"}</span>
            <span>{fmt(Math.abs(laba))}</span>
          </div>
          {pph31e>0 && (<>
            <div className="report-row" style={{marginTop:6,padding:"10px 16px",background:"rgba(21,101,192,0.08)",borderRadius:8,display:"flex",justifyContent:"space-between",fontSize:14}}>
              <div>
                <div style={{fontWeight:600,color:"#1565C0"}}>🏛️ PPh Badan Pasal 31E</div>
                <div style={{fontSize:11,color:"var(--text-soft)"}}>11% × {fmt(laba)} · Pasal 31E UU PPh (diskon 50% dari 22%)</div>
              </div>
              <span style={{fontWeight:700,color:"#1565C0"}}>{fmt(pph31e)}</span>
            </div>
            <div className="report-row total" style={{marginTop:6,background:"linear-gradient(135deg,#1565C0,#0D47A1)",borderRadius:10}}>
              <span>✅ LABA SETELAH PAJAK {tahun}</span>
              <span>{fmt(labaSetelahPajak)}</span>
            </div>
          </>)}
        </div>
      )}

      {mode==="detail" && (
        <>
          <div className="card">
            <div className="card-title">📈 Detail Pendapatan per Kategori — {tahun}</div>
            <div className="table-wrap">
              <table>
                <thead><tr>
                  <th style={thS}>Kategori</th>
                  <th style={{...thS,textAlign:"right"}}>Jml Transaksi</th>
                  <th style={{...thS,textAlign:"right"}}>Total</th>
                  <th style={{...thS,textAlign:"right"}}>Rata-rata/Bln</th>
                  <th style={{...thS,textAlign:"right"}}>% Kontribusi</th>
                </tr></thead>
                <tbody>
                  {katM.map(kat=>{
                    const items=dataT.filter(t=>t.jenis==="Pemasukan"&&t.kategori===kat);
                    const total=items.reduce((s,t)=>s+t.jumlah,0);
                    const pct=totM>0?(total/totM*100).toFixed(1):0;
                    return (<tr key={kat}>
                      <td style={tdS()}><strong>{kat}</strong></td>
                      <td style={tdS(true)}>{items.length}x</td>
                      <td style={tdS(true,{color:"var(--green)",fontWeight:600})}>{fmt(total)}</td>
                      <td style={tdS(true)}>{fmt(Math.round(total/12))}</td>
                      <td style={tdS(true)}>
                        <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end"}}>
                          <div style={{width:60,height:6,background:"var(--border)",borderRadius:3,overflow:"hidden"}}>
                            <div style={{width:`${pct}%`,height:"100%",background:"var(--green)",borderRadius:3}}/>
                          </div>
                          <span style={{fontSize:12,fontWeight:600,color:"var(--green)"}}>{pct}%</span>
                        </div>
                      </td>
                    </tr>);
                  })}
                  {!katM.length && <tr><td colSpan={5} style={{padding:"20px",textAlign:"center",color:"var(--text-soft)"}}>Tidak ada data pendapatan tahun {tahun}.</td></tr>}
                </tbody>
                <tfoot>
                  <tr>
                    <td style={tdS(false,{fontWeight:700,color:"var(--burgundy)",background:"var(--rose-pale)"})}>TOTAL</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>{dataT.filter(t=>t.jenis==="Pemasukan").length}x</td>
                    <td style={tdS(true,{fontWeight:700,color:"var(--green)"})}>{fmt(totM)}</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>{fmt(Math.round(totM/12))}</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>100%</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
          <div className="card">
            <div className="card-title">📉 Detail Pengeluaran per Kategori — {tahun}</div>
            <div className="table-wrap">
              <table>
                <thead><tr>
                  <th style={thS}>Kategori</th>
                  <th style={{...thS,textAlign:"right"}}>Jml Transaksi</th>
                  <th style={{...thS,textAlign:"right"}}>Total</th>
                  <th style={{...thS,textAlign:"right"}}>Rata-rata/Bln</th>
                  <th style={{...thS,textAlign:"right"}}>% dari Beban</th>
                </tr></thead>
                <tbody>
                  {katK.map(kat=>{
                    const items=dataT.filter(t=>t.jenis==="Pengeluaran"&&t.kategori===kat);
                    const total=items.reduce((s,t)=>s+t.jumlah,0);
                    const pct=totK>0?(total/totK*100).toFixed(1):0;
                    return (<tr key={kat}>
                      <td style={tdS()}><strong>{kat}</strong></td>
                      <td style={tdS(true)}>{items.length}x</td>
                      <td style={tdS(true,{color:"var(--rose)",fontWeight:600})}>{fmt(total)}</td>
                      <td style={tdS(true)}>{fmt(Math.round(total/12))}</td>
                      <td style={tdS(true)}>
                        <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end"}}>
                          <div style={{width:60,height:6,background:"var(--border)",borderRadius:3,overflow:"hidden"}}>
                            <div style={{width:`${pct}%`,height:"100%",background:"var(--rose)",borderRadius:3}}/>
                          </div>
                          <span style={{fontSize:12,fontWeight:600,color:"var(--rose)"}}>{pct}%</span>
                        </div>
                      </td>
                    </tr>);
                  })}
                  {!katK.length && <tr><td colSpan={5} style={{padding:"20px",textAlign:"center",color:"var(--text-soft)"}}>Tidak ada data pengeluaran tahun {tahun}.</td></tr>}
                </tbody>
                <tfoot>
                  <tr>
                    <td style={tdS(false,{fontWeight:700,color:"var(--burgundy)",background:"var(--rose-pale)"})}>TOTAL</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>{dataT.filter(t=>t.jenis==="Pengeluaran").length}x</td>
                    <td style={tdS(true,{fontWeight:700,color:"var(--rose)"})}>{fmt(totK)}</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>{fmt(Math.round(totK/12))}</td>
                    <td style={tdS(true,{background:"var(--rose-pale)"})}>100%</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </>
      )}

      {mode==="bulanan" && (
        <div className="card">
          <div className="card-title">📅 Matriks Bulanan — Rincian per Kategori {tahun}</div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style={{...thS,minWidth:160}}>Kategori</th>
                  {BULAN.map((b,i)=><th key={i} style={{...thS,textAlign:"right",minWidth:80}}>{b.slice(0,3)}</th>)}
                  <th style={{...thS,textAlign:"right",minWidth:110,background:"var(--gold-light)",color:"var(--gold)"}}>TOTAL</th>

              <tbody>
                <tr>
                  <td colSpan={14} style={{padding:"10px 12px",background:"var(--green-light)",fontWeight:700,color:"var(--green)",fontSize:12,letterSpacing:".8px",textTransform:"uppercase"}}>📈 PENDAPATAN</td>
                </tr>
                {katM.map(kat=>(
                  <tr key={kat}>
                    <td style={tdS(false,{paddingLeft:20})}>{kat}</td>
                    {Array.from({length:12},(_,i)=>{const v=perBulanKat("Pemasukan",kat,i);return <td key={i} style={tdS(true,{color:v===0?"var(--border)":"var(--green)",fontWeight:v>0?500:400})}>{v>0?fmt(v):"—"}</td>;})}
                    <td style={tdS(true,{fontWeight:700,color:"var(--green)"})}>{fmt(totPerKat("Pemasukan",kat))}</td>

                <tr style={{background:"var(--green-light)"}}>
                  <td style={tdS(false,{fontWeight:700,color:"var(--green)"})}>Total Pendapatan</td>
                  {Array.from({length:12},(_,i)=>{const v=totBulan("Pemasukan",i);return <td key={i} style={tdS(true,{fontWeight:700,color:"var(--green)"})}>{v>0?fmt(v):"—"}</td>;})}
                  <td style={tdS(true,{fontWeight:700,color:"var(--green)",fontSize:14})}>{fmt(totM)}</td>
                </tr>
                <tr>
                  <td colSpan={14} style={{padding:"10px 12px",background:"var(--rose-light)",fontWeight:700,color:"var(--rose)",fontSize:12,letterSpacing:".8px",textTransform:"uppercase"}}>📉 PENGELUARAN</td>

function GSheetPanel({transaksi, kamar, aset, kewajiban, onLoad, showToast}) {
  const [status,   setStatus]   = React.useState("idle");
  const [signedIn, setSignedIn] = React.useState(false);
  const [lastSync, setLastSync] = React.useState(null);
  const [msg,      setMsg]      = React.useState("");
  const [apiReady, setApiReady] = React.useState(false);

  // Cek API siap setiap 500ms sampai ready
  React.useEffect(()=>{
    const check = setInterval(()=>{
      if(window.gsIsReady && window.gsIsReady()){
        setApiReady(true);
        clearInterval(check);
      }
    }, 500);
    // Timeout 30 detik
    setTimeout(()=>clearInterval(check), 30000);
    return ()=>clearInterval(check);
  },[]);

  React.useEffect(()=>{
    window.addEventListener('gs-signed-in',  ()=>setSignedIn(true));
    window.addEventListener('gs-signed-out', ()=>setSignedIn(false));
  },[]);

  const handleLogin = async () => {
    if(!apiReady){ setStatus("error"); setMsg("Google API masih loading, tunggu beberapa detik lalu coba lagi."); return; }
    setStatus("loading"); setMsg("Menghubungkan ke Google...");
    try {
      await window.gsSignIn();
      setSignedIn(true); setStatus("success"); setMsg("✓ Berhasil login ke Google");
    } catch(e) { setStatus("error"); setMsg("Gagal login: "+String(e)); }
  };

  const handleSave = async () => {
    setStatus("loading"); setMsg("Menyimpan ke Google Sheets...");
    try {
      await window.gsSave({transaksi,kamar,aset,kewajiban});
      setLastSync(new Date().toLocaleString("id-ID"));
      setStatus("success"); setMsg("✓ Data berhasil disimpan ke Google Sheets!");
      showToast("✓ Tersimpan ke Google Sheets!");
    } catch(e) { setStatus("error"); setMsg("Gagal simpan: "+String(e)); }
  };

  const handleLoad = async () => {
    setStatus("loading"); setMsg("Memuat data dari Google Sheets...");
    try {
      const data = await window.gsLoad();
      onLoad(data);
      setLastSync(new Date().toLocaleString("id-ID"));
      setStatus("success"); setMsg("✓ Data berhasil dimuat dari Google Sheets!");
    } catch(e) { setStatus("error"); setMsg("Gagal muat: "+String(e)); }
  };

  const handleLogout = () => {
    try{ window.gsSignOut(); }catch(e){}
    setSignedIn(false); setStatus("idle"); setMsg("");
  };

  return (
    <div>
      {/* Info Google Sheets */}
      <div style={{background:"rgba(21,101,192,0.06)",borderRadius:12,padding:"16px 20px",marginBottom:20,border:"1px solid rgba(21,101,192,0.15)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <span style={{fontSize:22}}>📊</span>
          <div>
            <div style={{fontWeight:700,color:"#1565C0",fontSize:14}}>Google Sheets — Database Keuangan Kos Almarwa</div>
            <div style={{fontSize:12,color:"var(--text-soft)"}}>Data disimpan di spreadsheet milik almarwagriyasedjiwa@gmail.com</div>
          </div>
        </div>
        <div style={{fontSize:12,color:"var(--text-soft)",background:"white",borderRadius:8,padding:"8px 12px",fontFamily:"monospace",wordBreak:"break-all"}}>
          ID: 1K3PQqNskDK1BnJYJr0dT8n-tEVWeo8lbIwx1IzpBeFc
        </div>
      </div>

      {/* Status API */}
      <div style={{marginBottom:12,fontSize:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontWeight:600,color:"var(--text-soft)"}}>Google API:</span>
        {apiReady
          ? <span style={{color:"var(--green)",fontWeight:700}}>🟢 Siap</span>
          : <span style={{color:"var(--gold)",fontWeight:700}}>🟡 Loading... (tunggu beberapa detik)</span>
        }
      </div>

      {/* Status pesan */}
      {msg && (
        <div style={{padding:"10px 16px",borderRadius:10,marginBottom:16,fontSize:13,fontWeight:500,
          background:status==="error"?"var(--rose-light)":status==="success"?"var(--green-light)":"var(--gold-light)",
          color:status==="error"?"var(--rose)":status==="success"?"var(--green)":"var(--gold)"}}>
          {status==="loading"?"⏳ ":""}{msg}
        </div>
      )}

      {/* Tombol Aksi */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        {!signedIn ? (
          <button className="btn btn-primary" onClick={handleLogin} disabled={status==="loading"||!apiReady}
            style={{opacity:apiReady?1:0.6}}>
            {apiReady?"🔑 Login Google & Hubungkan Sheets":"⏳ Menunggu Google API..."}
          </button>
        ) : (
          <>
            <button className="btn btn-green" onClick={handleSave} disabled={status==="loading"}>
              ☁️ Simpan ke Google Sheets
            </button>
            <button className="btn btn-secondary" onClick={handleLoad} disabled={status==="loading"}>
              📥 Muat dari Google Sheets
            </button>
            <button className="btn btn-danger btn-sm" onClick={handleLogout}>
              Logout Google
            </button>
          </>
        )}
      </div>

      {/* Status login & last sync */}
      <div style={{display:"flex",gap:16,fontSize:12,color:"var(--text-soft)",flexWrap:"wrap"}}>
        <span>Status: <strong style={{color:signedIn?"var(--green)":"var(--rose)"}}>{signedIn?"🟢 Terhubung":"🔴 Belum login"}</strong></span>
        {lastSync && <span>Terakhir sync: <strong>{lastSync}</strong></span>}
      </div>

      {/* Panduan */}
      <div style={{marginTop:16,background:"var(--gold-light)",borderRadius:10,padding:"12px 16px",fontSize:12,color:"var(--gold)",lineHeight:1.7}}>

        2. Klik <strong>Login Google</strong> → izinkan akses Google Sheets<br/>
        3. Klik <strong>Simpan</strong> setelah input data baru<br/>
        4. Di perangkat lain: Login → klik <strong>Muat</strong> untuk ambil data terbaru<br/>
        5. Data tersimpan di tab Sheets: Transaksi, Kamar, Aset, Kewajiban
      </div>
    </div>
  );
}

// ─── APP UTAMA ───────────────────────────────────────────────────────────────
function App() {
  const now = new Date();
  const saved = LOAD();
  const [tab, setTab] = useState("dashboard");
  const [transaksi, setTransaksi] = useState(saved?.transaksi || INIT.transaksi);
  const [kamar, setKamar] = useState(saved?.kamar || INIT.kamar);
  const [aset, setAset] = useState(saved?.aset || INIT.aset);
  const [kewajiban, setKewajiban] = useState(saved?.kewajiban || INIT.kewajiban);
  const [filter, setFilter] = useState({bulan:now.getMonth()+1, tahun:now.getFullYear()});
  const [filterNeraca, setFilterNeraca] = useState({bulan:now.getMonth()+1, tahun:now.getFullYear()});
  // Jenis laporan per tab: "semua" atau "almarwa"
  const [jenisLR,      setJenisLR]      = useState("semua");
  const [jenisNeraca,  setJenisNeraca]  = useState("semua");
  const [jenisTahunan, setJenisTahunan] = useState("semua");
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [form, setForm] = useState({});

  // Auto-save ke localStorage setiap ada perubahan data
  useEffect(()=>{
    SAVE({transaksi,kamar,aset,kewajiban});
  },[transaksi,kamar,aset,kewajiban]);

  const showToast = (msg, type="success") => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),3500);
  };

  const filtered = transaksi.filter(t=>{
    const d=new Date(t.tanggal);
    return d.getMonth()+1===filter.bulan && d.getFullYear()===filter.tahun;
  });

  const totM = filtered.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const totK = filtered.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
  // Penyusutan bulan berjalan (laba rugi bulanan) - pakai bulan & tahun filter + usia pakai
  const totPenyAset = aset.filter(a=>a.jenis==="tetap"||!a.jenis).reduce((s,a)=>{
    if(!a.penyusutan) return s;
    if(!a.tanggalBeli) return s + a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    const thn = filter.tahun, bln = filter.bulan-1;
    if(thn < beli.getFullYear()) return s;
    if(thn===beli.getFullYear() && bln<beli.getMonth()) return s;
    if(a.usiaPakai>0) {
      const bulanSejakBeli = (thn-beli.getFullYear())*12 + (bln-beli.getMonth());
      if(bulanSejakBeli >= a.usiaPakai) return s; // usia pakai habis
    }
    return s + a.penyusutan;
  }, 0);
  // Laba rugi bulan berjalan (filter aktif)
  const labaKas   = totM - totK;               // tanpa penyusutan (laba kas)
  const labaRugi  = totM - totK - totPenyAset; // dengan penyusutan (laba akuntansi)
  // Tingkat hunian berdasarkan filter bulan — kamar aktif pada periode filter
  const awalBulan = new Date(filter.tahun, filter.bulan-1, 1);      // 1 [bulan filter]
  const akhirBulan = new Date(filter.tahun, filter.bulan, 0);       // hari terakhir [bulan filter]
  akhirBulan.setHours(23,59,59,999);
  const kamarAktifBulan = kamar.filter(k=>{
    if(!k.masuk) return false;                                       // belum ada tanggal masuk
    const tglMasuk = new Date(k.masuk);
    tglMasuk.setHours(0,0,0,0);
    if(tglMasuk > akhirBulan) return false;                         // belum masuk di bulan ini
    if(k.akhirSewa) {
      const tglAkhir = new Date(k.akhirSewa);
      tglAkhir.setHours(23,59,59,999);
      if(tglAkhir < awalBulan) return false;                        // sudah keluar sebelum bulan ini
    }
    return true;
  });
  const kamarTerisi = kamarAktifBulan.length;

  // ── Kalkulasi Neraca ──────────────────────────────────────────────────────
  const asetTetapList     = aset.filter(a=>a.jenis==="tetap"||!a.jenis);
  const totAsetTetapBruto = asetTetapList.reduce((s,a)=>s+a.nilai,0);
  const totKwj            = kewajiban.reduce((s,k)=>s+k.jumlah,0);
  const modalAwal         = totAsetTetapBruto - totKwj;

  const nTahun = filterNeraca.tahun;
  const nBulan = filterNeraca.bulan; // 1-12

  // Helper: penyusutan 1 aset untuk bulan bln (0-11) di tahun thn
  const penyAsetBulan = (a, thn, bln) => {
    if(!a.penyusutan || a.jenis==="lancar") return 0;
    if(!a.tanggalBeli) return a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    const beliThn = beli.getFullYear(), beliBln = beli.getMonth();
    if(thn < beliThn || (thn===beliThn && bln<beliBln)) return 0;
    if(a.usiaPakai > 0) {
      const bulanSejakBeli = (thn - beliThn)*12 + (bln - beliBln);
      if(bulanSejakBeli >= a.usiaPakai) return 0;
    }
    return a.penyusutan;
  };

  // Penyusutan semua aset tetap untuk 1 tahun penuh (Jan-Des)
  const totPenyTahun = (thn) => {
    let s = 0;
    for(let b=0; b<12; b++) s += asetTetapList.reduce((t,a)=>t+penyAsetBulan(a,thn,b),0);
    return s;
  };

  // Penyusutan semua aset tetap s/d bulan tertentu di tahun tertentu (Jan s/d bulan ke-bln, 1-based)
  const totPenySDbulan = (thn, bln) => {
    let s = 0;
    for(let b=0; b<bln; b++) s += asetTetapList.reduce((t,a)=>t+penyAsetBulan(a,thn,b),0);
    return s;
  };

  // Helper filter transaksi berdasarkan jenis laporan
  const filterRek = (arr, jenis) => jenis==="almarwa" ? arr.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa") : arr;

  // Tahun-tahun yang ada data transaksi
  const tahunNeracaList = [...new Set(transaksi.map(t=>new Date(t.tanggal).getFullYear()))].sort();

  // Laba/Rugi s/d bulan terpilih di tahun terpilih (sesuai jenisNeraca)
  const trSDbulan = filterRek(transaksi.filter(t=>{
    const d = new Date(t.tanggal);
    return d.getFullYear()===nTahun && d.getMonth()+1<=nBulan;
  }), jenisNeraca);
  const mSDbulan    = trSDbulan.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const kSDbulan    = trSDbulan.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
  const penySDbulan = totPenySDbulan(nTahun, nBulan);
  const labaSDbulan = mSDbulan - kSDbulan - penySDbulan;

  const labaTahunIni = labaSDbulan;

  // Akumulasi laba ditahan tahun-tahun sebelumnya (sesuai jenisNeraca)
  const tahunSebelum    = tahunNeracaList.filter(y=>y<nTahun);
  const akumLabaDitahan = tahunSebelum.reduce((acc,thn)=>{
    const tr = filterRek(transaksi.filter(t=>new Date(t.tanggal).getFullYear()===thn), jenisNeraca);
    const m  = tr.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
    const k  = tr.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
    return acc + (m - k - totPenyTahun(thn));
  }, 0);

  const ekuitas = modalAwal + akumLabaDitahan + labaSDbulan;

  const handleSaveTransaksi = () => {
    if(!form.tanggal||!form.jenis||!form.kategori||!form.jumlah){showToast("Lengkapi semua field!","error");return;}
    const data = {
      tanggal:form.tanggal, jenis:form.jenis, kategori:form.kategori,
      deskripsi:form.deskripsi||"-", jumlah:Number(form.jumlah),
      kamar:form.kamar||"", rekening:form.rekening||"Al Marwa",
      bukti:form.bukti||null, buktinNama:form.buktiNama||null
    };
    if(form._editId){
      setTransaksi(p=>p.map(t=>t.id===form._editId?{...t,...data}:t));
      showToast("✓ Transaksi berhasil diperbarui!");
    } else {
      setTransaksi(p=>[{id:Date.now(),...data},...p]);
      showToast("✓ Transaksi berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const openEditTransaksi = (t) => {
    setForm({_editId:t.id,tanggal:t.tanggal,jenis:t.jenis,kategori:t.kategori,jumlah:t.jumlah,
      deskripsi:t.deskripsi,kamar:t.kamar||"",rekening:t.rekening||"Al Marwa",
      bukti:t.bukti||null, buktiNama:t.buktiNama||null});
    setModal("transaksi");
  };
  const handleUploadBukti = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const MAX = 10 * 1024 * 1024; // 10 MB
    if(file.size > MAX){ showToast("File terlalu besar! Maksimal 10 MB","error"); e.target.value=""; return; }
    const reader = new FileReader();
    reader.onload = (ev) => setForm(f=>({...f, bukti:ev.target.result, buktiNama:file.name}));
    reader.readAsDataURL(file);
    showToast("✓ Bukti berhasil diunggah");
  };
  const handleSaveKamar = () => {
    if(!form.nomor||!form.harga){showToast("Lengkapi data kamar!","error");return;}
    const data = {
      nomor:form.nomor, penghuni:form.penghuni||"-",
      harga:Number(form.harga), status:form.penghuni&&form.penghuni!=="-"?"Terisi":"Kosong",
      masuk:form.masuk||"", akhirSewa:form.akhirSewa||""
    };
    if(form._editId) {
      setKamar(p=>p.map(k=>k.id===form._editId?{...k,...data}:k));
      showToast("✓ Data kamar berhasil diperbarui!");
    } else {
      setKamar(p=>[...p,{id:Date.now(),...data}]);
      showToast("✓ Kamar berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const handleSaveAset = () => {
    if(!form.nama||!form.nilai){showToast("Lengkapi nama dan nilai aset!","error");return;}
    const usiaPakai = Number(form.usiaPakai||0);
    // Penyusutan dihitung otomatis: nilai ÷ usia pakai (bulan). Manual hanya sebagai fallback.
    const penyusutan = (form.jenis==="tetap" && usiaPakai>0)
      ? Math.round(Number(form.nilai)/usiaPakai)
      : Number(form.penyusutan||0);
    if(form._editId) {
      setAset(p=>p.map(a=>a.id===form._editId?{...a,nama:form.nama,nilai:Number(form.nilai),penyusutan,usiaPakai,jenis:form.jenis||"tetap",keterangan:form.keterangan||"",tanggalBeli:form.tanggalBeli||""}:a));
      showToast("✓ Aset berhasil diperbarui!");
    } else {
      setAset(p=>[...p,{id:Date.now(),nama:form.nama,nilai:Number(form.nilai),penyusutan,usiaPakai,jenis:form.jenis||"tetap",keterangan:form.keterangan||"",tanggalBeli:form.tanggalBeli||""}]);
      showToast("✓ Aset berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const handleSaveKwj = () => {
    if(!form.nama||!form.jumlah){showToast("Lengkapi nama dan jumlah!","error");return;}
    if(form._editId) {
      setKewajiban(p=>p.map(k=>k.id===form._editId?{...k,nama:form.nama,jumlah:Number(form.jumlah),cicilan:Number(form.cicilan||0)}:k));
      showToast("✓ Kewajiban berhasil diperbarui!");
    } else {
      setKewajiban(p=>[...p,{id:Date.now(),nama:form.nama,jumlah:Number(form.jumlah),cicilan:Number(form.cicilan||0)}]);
      showToast("✓ Kewajiban berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };

  const exportCSV = () => {
    const h="Tanggal,Jenis,Kategori,Deskripsi,Jumlah,Kamar\n";
    const rows=filtered.map(t=>`${t.tanggal},${t.jenis},${t.kategori},"${t.deskripsi}",${t.jumlah},${t.kamar}`).join("\n");
    const blob=new Blob([h+rows],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`Transaksi_Almarwa_${filter.bulan}_${filter.tahun}.csv`;a.click();
    showToast("✓ CSV berhasil diexport!");
  };

  const exportAllData = () => {
    const data = {transaksi,kamar,aset,kewajiban,exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a = document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`Backup_Almarwa_${today()}.json`;a.click();
    showToast("✓ Backup data berhasil didownload!");
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.transaksi) setTransaksi(data.transaksi);
        if(data.kamar) setKamar(data.kamar);
        if(data.aset) setAset(data.aset);
        if(data.kewajiban) setKewajiban(data.kewajiban);
        showToast("✓ Data berhasil diimpor!");
      } catch { showToast("File tidak valid!","error"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const TABS = [
    {id:"dashboard",label:"Dashboard",icon:"🏠"},
    {id:"transaksi",label:"Transaksi",icon:"💳"},
    {id:"kamar",label:"Data Kamar",icon:"🚪"},
    {id:"aset",label:"Aset & Kewajiban",icon:"🏢"},
    {id:"laba-rugi",label:"Laba Rugi",icon:"📊"},
    {id:"neraca",label:"Neraca",icon:"⚖️"},
    {id:"tahunan",label:"Laporan Tahunan",icon:"📅"},
    {id:"backup",label:"Backup/Restore",icon:"💾"},
  ];

  return (
    <div className="app">
      <header className="header">
        <div className="header-brand">
          <span className="header-icon">🌸</span>
          <div>
            <div className="header-title">Kos Putri Almarwa</div>
            <div className="header-sub">Sistem Pembukuan Usaha</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="sync-badge" onClick={()=>setTab("backup")}>☁️ Google Sheets</div>
        </div>
      </header>

      <nav className="nav">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-btn${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
            <span>{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>

      <main className="main">

        {/* DASHBOARD */}
        {tab==="dashboard" && (<>
          {/* Notifikasi sewa jatuh tempo di dashboard */}
          {(()=>{
            const tod=new Date(); tod.setHours(0,0,0,0);
            const notif=kamar.filter(k=>{
              if(!k.akhirSewa||k.status!=="Terisi") return false;
              const akhir=new Date(k.akhirSewa); akhir.setHours(0,0,0,0);
              const s=Math.ceil((akhir-tod)/(1000*60*60*24));
              return s>=0&&s<=5;
            });
            if(!notif.length) return null;
            return <div style={{marginBottom:16,padding:"14px 18px",borderRadius:14,background:"#FFF3E0",border:"1.5px solid #FFCC80",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}
              onClick={()=>setTab("kamar")}>
              <span style={{fontSize:22}}>🔔</span>
              <div>
                <div style={{fontWeight:700,color:"#E65100",fontSize:13}}>
                  {notif.length} kamar akan jatuh tempo dalam 5 hari ke depan!
                </div>
                <div style={{fontSize:12,color:"#795548",marginTop:2}}>
                  {notif.map(k=>`Kamar ${k.nomor} (${k.penghuni})`).join(" · ")} — Klik untuk lihat detail
                </div>
              </div>
              <span style={{marginLeft:"auto",fontSize:12,color:"#E65100",fontWeight:600}}>Lihat →</span>
            </div>;
          })()}
          <FilterBar filter={filter} setFilter={setFilter}/>
          {/* Baris 1: Pemasukan & Pengeluaran */}
          <div className="stat-grid" style={{gridTemplateColumns:"repeat(2,1fr)",marginBottom:12}}>
            <div className="stat-card green">
              <div className="stat-label">Total Pemasukan</div>
              <div className="stat-value">{fmt(totM)}</div>
              <div className="stat-sub">{BULAN[filter.bulan-1]} {filter.tahun}</div>
            </div>
            <div className="stat-card rose">
              <div className="stat-label">Total Pengeluaran</div>
              <div className="stat-value">{fmt(totK)}</div>
              <div className="stat-sub">{BULAN[filter.bulan-1]} {filter.tahun}</div>
            </div>
          </div>
          {/* Baris 2: Laba Kas, Laba Akuntansi, Hunian */}
          <div className="stat-grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
            <div className={`stat-card ${labaKas>=0?"green":"rose"}`}>
              <div className="stat-label">💵 Laba/Rugi Kas</div>
              <div className="stat-value">{fmt(Math.abs(labaKas))}</div>
              <div className="stat-sub">{labaKas>=0?"✓ Untung":"✗ Rugi"} · tanpa penyusutan</div>
            </div>
            <div className={`stat-card ${labaRugi>=0?"green":"rose"}`}>
              <div className="stat-label">📊 Laba/Rugi Akuntansi</div>
              <div className="stat-value">{fmt(Math.abs(labaRugi))}</div>
              <div className="stat-sub">{labaRugi>=0?"✓ Untung":"✗ Rugi"} · penyusutan {fmt(totPenyAset)}</div>
            </div>
            <div className="stat-card gold">
              <div className="stat-label">Tingkat Hunian</div>
              <div className="stat-value">{kamarTerisi}/{kamar.length}</div>
              <div className="stat-sub">
                {Math.round(kamarTerisi/kamar.length*100)}% · {BULAN[filter.bulan-1]} {filter.tahun}
                {(()=>{
                  const tod=new Date(); tod.setHours(0,0,0,0);
                  const n=kamar.filter(k=>{
                    if(!k.akhirSewa||k.status!=="Terisi") return false;
                    const a=new Date(k.akhirSewa); a.setHours(0,0,0,0);
                    return Math.ceil((a-tod)/(1000*60*60*24))<=5;
                  }).length;
                  return n>0?<span style={{color:"#E65100",fontWeight:700}}> · {n} jatuh tempo</span>:null;
                })()}
              </div>
            </div>
          </div>

          {/* KARTU REKENING — akumulasi s/d bulan terpilih */}
          {(()=>{
            // Transaksi s/d bulan & tahun filter (akumulasi)
            const sdBulan = transaksi.filter(t=>{
              const d=new Date(t.tanggal);
              return d.getFullYear()<filter.tahun ||(d.getFullYear()===filter.tahun && d.getMonth()+1<=filter.bulan);
            });
            const rek = (nama,jenis) => sdBulan
              .filter(t=>(t.rekening||"Al Marwa")===nama && t.jenis===jenis)
              .reduce((s,t)=>s+t.jumlah,0);
            const amIn=rek("Al Marwa","Pemasukan"), amOut=rek("Al Marwa","Pengeluaran");
            const prIn=rek("Pribadi","Pemasukan"),  prOut=rek("Pribadi","Pengeluaran");
            const saldoAM = amIn - amOut;
            const saldoPr = prIn - prOut;

            // Penyusutan s/d bulan filter (untuk laba akuntansi Al Marwa)
            let penySDfilt = 0;
            for(let b=0; b<filter.bulan; b++) {
              penySDfilt += asetTetapList.reduce((s,a)=>s+penyAsetBulan(a,filter.tahun,b),0);
            }
            // Laba akuntansi Al Marwa = Saldo Kas Al Marwa - Penyusutan s/d bulan
            const labaAkuntansiAM = saldoAM - penySDfilt;
            // PPh 31E = 11% × laba akuntansi Al Marwa (hanya jika laba > 0)
            const pphAM = labaAkuntansiAM > 0 ? Math.round(labaAkuntansiAM * 0.11) : 0;
            const saldoAMsetelahPajak = saldoAM - pphAM;
            // Total saldo gabungan
            const totalSaldo = saldoAMsetelahPajak + saldoPr;

            const labelPeriode = `s/d ${BULAN[filter.bulan-1]} ${filter.tahun}`;
            const Card = ({label,val,sub,color,icon}) => (
              <div className="stat-card" style={{borderTop:`3px solid ${color}`}}>
                <div className="stat-label">{icon} {label}</div>
                <div className="stat-value" style={{color,fontSize:20}}>{fmt(Math.abs(val))}</div>
                <div className="stat-sub">{sub}</div>
              </div>
            );
            return (<>
              {/* Header pemisah */}
              <div style={{display:"flex",alignItems:"center",gap:12,margin:"8px 0 12px"}}>
                <div style={{height:1,flex:1,background:"var(--border)"}}/>
                <span style={{fontSize:12,fontWeight:700,color:"var(--text-soft)",textTransform:"uppercase",letterSpacing:"1px"}}>
                  Rekap Rekening {labelPeriode}
                </span>
                <div style={{height:1,flex:1,background:"var(--border)"}}/>
              </div>

              {/* Rekening Al Marwa — 5 kartu */}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--burgundy)",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>
                  🏦 Rekening Al Marwa
                </div>
                {/* Baris 1: 4 kartu sejajar */}
                <div className="stat-grid" style={{marginBottom:8}}>
                  <Card label="Pendapatan Al Marwa"  val={amIn}   sub={labelPeriode} color="var(--green)" icon="▲"/>
                  <Card label="Pengeluaran Al Marwa" val={amOut}  sub={labelPeriode} color="var(--rose)"  icon="▼"/>
                  <div className="stat-card" style={{borderTop:`3px solid ${saldoAM>=0?"var(--green)":"var(--rose)"}`}}>
                    <div className="stat-label">🏦 Saldo Al Marwa (Kas)</div>
                    <div className="stat-value" style={{color:saldoAM>=0?"var(--green)":"var(--rose)",fontSize:20}}>{fmt(Math.abs(saldoAM))}</div>
                    <div className="stat-sub">{saldoAM>=0?"✓ Surplus":"✗ Defisit"} · {labelPeriode}</div>
                  </div>
                  <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
                    <div className="stat-label" style={{color:"#1565C0"}}>🏛️ PPh Pasal 31E (11%)</div>
                    <div className="stat-value" style={{color:"#1565C0",fontSize:20}}>{fmt(pphAM)}</div>
                    <div className="stat-sub">
                      {pphAM>0
                        ? `11% × Laba Akuntansi ${fmt(labaAkuntansiAM)}`
                        : labaAkuntansiAM<=0?"Tidak ada pajak (rugi/impas)":"—"}
                    </div>
                  </div>
                </div>
                {/* Baris 2: Saldo Setelah Pajak — lebar penuh */}
                <div className="stat-card" style={{
                  borderTop:`3px solid ${saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)"}`,
                  display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12
                }}>
                  <div>
                    <div className="stat-label" style={{color:saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)"}}>✅ Saldo Al Marwa Setelah Pajak</div>
                    <div className="stat-value" style={{color:saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)",fontSize:24,marginTop:4}}>{fmt(Math.abs(saldoAMsetelahPajak))}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="stat-sub" style={{marginBottom:4}}>{saldoAMsetelahPajak>=0?"✓ Bersih setelah PPh":"✗ Defisit"} · {labelPeriode}</div>
                    <div style={{fontSize:11,color:"var(--text-soft)"}}>Saldo Kas {fmt(saldoAM)} − PPh {fmt(pphAM)}</div>
                  </div>
                </div>
              </div>

              {/* Rekening Pribadi — 3 kartu */}
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--green)",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>
                  👤 Rekening Pribadi
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
                  <Card label="Pendapatan Pribadi"  val={prIn}   sub={labelPeriode} color="var(--green)" icon="▲"/>
                  <Card label="Pengeluaran Pribadi" val={prOut}  sub={labelPeriode} color="var(--rose)"  icon="▼"/>
                  <div className="stat-card" style={{borderTop:`3px solid ${saldoPr>=0?"var(--green)":"var(--rose)"}`}}>
                    <div className="stat-label">👤 Saldo Pribadi</div>
                    <div className="stat-value" style={{color:saldoPr>=0?"var(--green)":"var(--rose)",fontSize:20}}>{fmt(Math.abs(saldoPr))}</div>
                    <div className="stat-sub">{saldoPr>=0?"✓ Surplus":"✗ Defisit"} · {labelPeriode}</div>
                  </div>
                </div>
              </div>

              {/* CARD TOTAL SALDO — menonjol */}
              <div style={{
                background:"linear-gradient(135deg,var(--burgundy) 0%,#5C1A28 100%)",
                borderRadius:18, padding:"24px 28px", marginBottom:8,
                boxShadow:"0 8px 32px rgba(123,45,62,0.35)",
                display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:16
              }}>
                <div>
                  <div style={{color:"rgba(253,246,238,0.7)",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:6}}>
                    🏦 Total Saldo Gabungan — Rekap {labelPeriode}
                  </div>
                  <div style={{color:"var(--cream)",fontSize:32,fontWeight:700,fontFamily:"'Playfair Display',serif",letterSpacing:"-0.5px"}}>
                    {fmt(totalSaldo)}
                  </div>
                  <div style={{color:"rgba(253,246,238,0.65)",fontSize:12,marginTop:6,display:"flex",gap:16,flexWrap:"wrap"}}>
                    <span>✅ Al Marwa Setelah Pajak: <strong style={{color:"var(--cream)"}}>{fmt(saldoAMsetelahPajak)}</strong></span>
                    <span>+</span>
                    <span>👤 Pribadi: <strong style={{color:"var(--cream)"}}>{fmt(saldoPr)}</strong></span>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:"rgba(253,246,238,0.6)",fontSize:11,marginBottom:4}}>Status</div>
                  <div style={{
                    padding:"8px 20px", borderRadius:20,
                    background:totalSaldo>=0?"rgba(90,230,120,0.2)":"rgba(200,115,106,0.2)",
                    color:totalSaldo>=0?"#5AE678":"#F2A39D",
                    fontWeight:700, fontSize:14
                  }}>
                    {totalSaldo>=0?"✓ Surplus":"✗ Defisit"}
                  </div>
                </div>
              </div>
            </>);
          })()}

          <div className="card">
            <div className="card-title">💳 Transaksi Terbaru</div>
            <TransaksiTable data={filtered.slice(0,8)} onEdit={openEditTransaksi} onDelete={id=>{setTransaksi(p=>p.filter(t=>t.id!==id));showToast("Transaksi dihapus","info");}} short/>
          </div>
        </>)}

        {/* TRANSAKSI */}
        {tab==="transaksi" && (<>
          <FilterBar filter={filter} setFilter={setFilter}/>
          <div className="card">
            <div className="section-header">
              <div className="card-title" style={{marginBottom:0}}>💳 Daftar Transaksi</div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-secondary btn-sm" onClick={exportCSV}>📥 Export CSV</button>
                <button className="btn btn-primary btn-sm" onClick={()=>{setForm({tanggal:today(),jenis:"Pemasukan"});setModal("transaksi");}}>+ Tambah</button>
              </div>
            </div>
            <hr className="divider"/>
            <TransaksiTable data={filtered} onEdit={openEditTransaksi} onDelete={id=>{setTransaksi(p=>p.filter(t=>t.id!==id));showToast("Transaksi dihapus","info");}}/>
          </div>
        </>)}

        {/* KAMAR */}
        {tab==="kamar" && (()=>{
          const today2 = new Date(); today2.setHours(0,0,0,0);
          // Kamar yang perlu notifikasi: akhirSewa dalam 5 hari ke depan
          const notifKamar = kamar.filter(k=>{
            if(!k.akhirSewa||k.status!=="Terisi") return false;
            const akhir = new Date(k.akhirSewa); akhir.setHours(0,0,0,0);
            const selisih = Math.ceil((akhir-today2)/(1000*60*60*24));
            return selisih>=0 && selisih<=5;
          }).map(k=>{
            const akhir=new Date(k.akhirSewa); akhir.setHours(0,0,0,0);
            const selisih=Math.ceil((akhir-today2)/(1000*60*60*24));
            return {...k,selisih};
          });
          return (<>
            {/* NOTIFIKASI */}
            {notifKamar.length>0 && (
              <div style={{marginBottom:20}}>
                {notifKamar.map(k=>(
                  <div key={k.id} style={{
                    display:"flex",alignItems:"flex-start",gap:14,
                    padding:"16px 20px",borderRadius:14,marginBottom:10,
                    background:k.selisih===0?"#FDE8E8":k.selisih<=2?"#FFF3E0":"#FFF8E1",
                    border:`1.5px solid ${k.selisih===0?"#F5B5B5":k.selisih<=2?"#FFCC80":"#FFE082"}`,
                    boxShadow:"0 2px 10px rgba(0,0,0,0.06)"
                  }}>
                    <div style={{fontSize:26,lineHeight:1}}>{k.selisih===0?"🚨":k.selisih<=2?"⚠️":"🔔"}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14,color:k.selisih===0?"#C0392B":k.selisih<=2?"#E65100":"#F57F17",marginBottom:4}}>
                        {k.selisih===0?"HARI INI — Sewa Jatuh Tempo!"
                          :k.selisih===1?"BESOK — Sewa Jatuh Tempo!"
                          :`${k.selisih} Hari Lagi — Sewa Hampir Berakhir`}
                      </div>
                      <div style={{fontSize:13,color:"#5D4037"}}>
                        Kamar <strong>{k.nomor}</strong> — {k.penghuni}
                        <span style={{margin:"0 8px",color:"#BCAAA4"}}>·</span>
                        Sewa berakhir: <strong>{new Date(k.akhirSewa).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</strong>
                        <span style={{margin:"0 8px",color:"#BCAAA4"}}>·</span>
                        Harga: {fmt(k.harga)}/bln
                      </div>
                    </div>
                    <button className="btn btn-sm" style={{background:"var(--burgundy)",color:"white",whiteSpace:"nowrap",flexShrink:0}}
                      onClick={()=>{setForm({_editId:k.id,nomor:k.nomor,penghuni:k.penghuni,harga:k.harga,masuk:k.masuk,akhirSewa:k.akhirSewa});setModal("kamar");}}>
                      ✏️ Perpanjang
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TABEL KAMAR */}
            <div className="card">
              <div className="section-header">
                <div className="card-title" style={{marginBottom:0}}>🚪 Data Kamar</div>
                <button className="btn btn-primary btn-sm" onClick={()=>{setForm({});setModal("kamar");}}>+ Tambah Kamar</button>
              </div>
              <hr className="divider"/>
              <div className="table-wrap">
                <table>
                  <thead><tr>
                    <th>No. Kamar</th><th>Penghuni</th><th>Harga/Bln</th>
                    <th>Status</th><th>Tgl Masuk</th><th>Akhir Sewa</th><th>Sisa</th><th>Aksi</th>
                  </tr></thead>
                  <tbody>
                    {kamar.map(k=>{
                      let selisihHari=null, labelSisa=null, warnaTag="var(--text-soft)", bgTag="rgba(0,0,0,0.05)";
                      if(k.akhirSewa&&k.status==="Terisi"){
                        const akhir=new Date(k.akhirSewa); akhir.setHours(0,0,0,0);
                        selisihHari=Math.ceil((akhir-today2)/(1000*60*60*24));
                        if(selisihHari<0){labelSisa="Kedaluwarsa";warnaTag="#C0392B";bgTag="rgba(192,57,43,0.1)";}
                        else if(selisihHari===0){labelSisa="Hari ini!";warnaTag="#C0392B";bgTag="rgba(192,57,43,0.1)";}
                        else if(selisihHari<=5){labelSisa=selisihHari+"h lagi";warnaTag="#E65100";bgTag="rgba(230,81,0,0.1)";}
                        else if(selisihHari<=30){labelSisa=selisihHari+"h lagi";warnaTag="#C49A5A";bgTag="rgba(196,154,90,0.15)";}
                        else{const bln=Math.floor(selisihHari/30);const hr=selisihHari%30;labelSisa=bln+"bln"+(hr>0?" "+hr+"h":"")+" lagi";warnaTag="var(--green)";bgTag="rgba(74,124,107,0.1)";}
                      }
                      return (<tr key={k.id} style={selisihHari!==null&&selisihHari<=5?{background:"#FFF8F0"}:{}}>
                        <td><strong>{k.nomor}</strong></td>
                        <td>{k.penghuni}</td>
                        <td>{fmt(k.harga)}</td>
                        <td><span className={`badge ${k.status==="Terisi"?"badge-green":"badge-rose"}`}>{k.status}</span></td>
                        <td style={{color:"var(--text-soft)",fontSize:13}}>{k.masuk||"—"}</td>
                        <td style={{fontSize:13}}>{k.akhirSewa
                          ?<><div style={{fontWeight:500}}>{new Date(k.akhirSewa).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</div></>
                          :"—"}</td>
                        <td>
                          {labelSisa&&<span style={{fontSize:12,fontWeight:700,color:warnaTag,padding:"3px 9px",borderRadius:8,background:bgTag,display:"inline-block"}}>{labelSisa}</span>}
                        </td>
                        <td><div className="actions">
                          <button className="btn btn-secondary btn-sm" onClick={()=>{setForm({_editId:k.id,nomor:k.nomor,penghuni:k.penghuni,harga:k.harga,masuk:k.masuk,akhirSewa:k.akhirSewa||""});setModal("kamar");}}>✏️</button>
                          <button className="btn btn-danger btn-sm" onClick={()=>{setKamar(p=>p.filter(x=>x.id!==k.id));showToast("Kamar dihapus","info");}}>✕</button>
                        </div></td>
                      </tr>);
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </>);
        })()}

        {/* LABA RUGI */}
        {tab==="laba-rugi" && (<>
          <FilterBar filter={filter} setFilter={setFilter}/>
          <SelectorRekening value={jenisLR} onChange={setJenisLR}/>
          <div className="card">
            <div className="section-header">
              <div className="card-title" style={{marginBottom:0}}>
                📊 Laporan Laba Rugi — {BULAN[filter.bulan-1]} {filter.tahun}
