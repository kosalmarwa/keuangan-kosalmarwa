  const [form, setForm] = useState({});

  // ── State Google Sheets Sync ──────────────────────────────────────────────
  const [syncStatus,  setSyncStatus]  = useState("idle"); // idle|saving|saved|error|retrying
  const [syncMsg,     setSyncMsg]     = useState("");
  const [syncTime,    setSyncTime]    = useState(null);   // timestamp terakhir berhasil save
  const [loadedAt,    setLoadedAt]    = useState(saved?._savedAt || 0); // ts data yang sedang dipakai
  const [startupModal,setStartupModal]= useState(null);  // null|"login"|"diff"
  const [startupData, setStartupData] = useState(null);  // data dari sheets saat diff
  const [gsSignedIn,  setGsSignedIn]  = useState(false);
  const [retryCount,  setRetryCount]  = useState(0);
  const [dataReady,   setDataReady]   = useState(false); // true setelah data dimuat dari Sheets
  const autoSaveTimer = React.useRef(null);
  const isSaving      = React.useRef(false);

  // ── Auto-save ke localStorage ─────────────────────────────────────────────
  useEffect(()=>{
    SAVE({transaksi,kamar,aset,kewajiban,modalPemilik});
  },[transaksi,kamar,aset,kewajiban,modalPemilik]);

  // ── Auto-save ke Google Sheets (debounce 5 detik) ─────────────────────────
  useEffect(()=>{
    if(!gsSignedIn) return;
    if(!dataReady) return; // JANGAN auto-save sebelum data selesai dimuat dari Sheets
    if(autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setSyncStatus("pending");
    autoSaveTimer.current = setTimeout(()=>{ doAutoSave(); }, 5000);
    return ()=>{ if(autoSaveTimer.current) clearTimeout(autoSaveTimer.current); };
  },[transaksi,kamar,aset,kewajiban,modalPemilik,gsSignedIn,dataReady]);

  const doAutoSave = async (retries=0) => {
    if(isSaving.current) return;
    // Gerbang keamanan: data harus sudah termuat & tidak boleh kosong
    if(!dataReady) return;
    const _totalRows = transaksi.length + kamar.length + aset.length + kewajiban.length;
    if(_totalRows === 0){ setSyncStatus("idle"); setSyncMsg(""); return; }
    isSaving.current = true;
    setSyncStatus("saving"); setSyncMsg("Menyimpan ke Google Sheets...");
    try {
      // Cek apakah Sheets sudah diupdate orang lain sejak kita load
      const tsSheets = await window.gsGetTimestamp();
      if(tsSheets > loadedAt && loadedAt > 0) {
        // Sheets lebih baru — wajib muat dulu
        isSaving.current = false;
        setSyncStatus("conflict");
        setSyncMsg("⚠️ Data di Sheets sudah diupdate orang lain. Muat terbaru dulu.");
        setModal("syncConflict");
        return;
      }
      const ts = await window.gsSave({transaksi,kamar,aset,kewajiban,modalPemilik});
      setSyncTime(new Date());
      setLoadedAt(ts);
      setSyncStatus("saved");
      setSyncMsg("");
      setRetryCount(0);
    } catch(e) {
      if(retries < 3) {
        setSyncStatus("retrying");
        setSyncMsg(`Gagal, mencoba ulang (${retries+1}/3)...`);
        setTimeout(()=>{ isSaving.current=false; doAutoSave(retries+1); }, 10000);
        return;
      }
      setSyncStatus("error");
      setSyncMsg("Gagal menyimpan setelah 3x percobaan.");
      setRetryCount(0);
    }
    isSaving.current = false;
  };

  // ── Startup: cek login & bandingkan data ──────────────────────────────────
  useEffect(()=>{
    // Dengarkan event sign in/out
    window.addEventListener('gs-signed-in', ()=>{ setGsSignedIn(true); runStartupCheck(); });
    window.addEventListener('gs-signed-out',()=>{ setGsSignedIn(false); });

    // Cek apakah API sudah siap dan sudah pernah login
    const waitAndCheck = setInterval(()=>{
      if(window.gsIsReady && window.gsIsReady()){
        clearInterval(waitAndCheck);
        // Jika belum pernah login → tampilkan notif login
        if(!window.gsIsSignedIn()){
          setTimeout(()=>setStartupModal("login"), 1000);
        } else {
          setGsSignedIn(true);
          runStartupCheck();
        }
      }
    }, 500);
    setTimeout(()=>clearInterval(waitAndCheck), 30000);
  },[]);

  const runStartupCheck = async () => {
    setSyncStatus("saving"); setSyncMsg("Memuat data dari Google Sheets...");
    try {
      const sheetsData = await window.gsLoad();
      const sheetsKosong = !sheetsData.transaksi?.length &&
                           !sheetsData.kamar?.length &&
                           !sheetsData.aset?.length;
      const lokalAdaData = (saved?.transaksi?.length || 0) > 0 ||
                           (saved?.kamar?.length || 0) > 0;

      if(sheetsKosong && lokalAdaData) {
        // Sheets kosong tapi lokal ada data → tanya upload
        setStartupData(sheetsData);
        setStartupModal("uploadLokal");
        setSyncStatus("idle"); setSyncMsg("");
        setDataReady(true); // data lokal ada isinya → aman untuk auto-save
      } else {
        // Sheets ada data → langsung pakai Sheets, tidak tanya
        applySheets(sheetsData);
      }
    } catch(e) {
      console.warn("Startup check gagal:", e);
      setSyncStatus("error");
      setSyncMsg("Gagal memuat dari Sheets: "+String(e));
    }
  };

  // Terapkan data dari Sheets — tidak ada pilihan lokal
  const applySheets = (sheetsData) => {
    if(sheetsData.transaksi)  setTransaksi(sheetsData.transaksi);
    if(sheetsData.kamar)      setKamar(sheetsData.kamar);
    if(sheetsData.aset)       setAset(sheetsData.aset);
    if(sheetsData.kewajiban)  setKewajiban(sheetsData.kewajiban);
    // Hanya terapkan modalPemilik dari Sheets jika nilainya valid (> 0)
    if(sheetsData.modalPemilik != null && Number(sheetsData.modalPemilik) > 0)
      setModalPemilik(Number(sheetsData.modalPemilik));
    setLoadedAt(sheetsData._savedAt || Date.now());
    setSyncStatus("saved"); setSyncTime(new Date());
    setDataReady(true); // data sudah termuat → auto-save boleh berjalan
    showToast("✓ Data dimuat dari Google Sheets");
  };

  // Hanya dipanggil saat user pilih upload lokal ke Sheets (Sheets kosong)
  const applyStartupData = (source) => {
    if(source === "upload" && saved) {
      // Upload data lokal ke Sheets
      setLoadedAt(saved._savedAt || 0);
      showToast("✓ Data lokal akan diupload ke Google Sheets...");
      // Trigger auto-save segera
      if(autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
      autoSaveTimer.current = setTimeout(()=>doAutoSave(), 500);
    } else {
      // Mulai dengan data kosong
      showToast("✓ Memulai dengan data kosong");
    }
    setStartupModal(null);
    setStartupData(null);
  };

  const handleSyncConflict = async () => {
    // Paksa muat terbaru dari Sheets
    setModal(null);
    setSyncStatus("saving"); setSyncMsg("Memuat data terbaru dari Sheets...");
    try {
      const sheetsData = await window.gsLoad();
      if(sheetsData.transaksi?.length) setTransaksi(sheetsData.transaksi);
      if(sheetsData.kamar?.length)     setKamar(sheetsData.kamar);
      if(sheetsData.aset?.length)      setAset(sheetsData.aset);
      if(sheetsData.kewajiban?.length) setKewajiban(sheetsData.kewajiban);
      setLoadedAt(sheetsData._savedAt || 0);
      setSyncStatus("idle"); setSyncMsg("");
      showToast("✓ Data terbaru dimuat. Silakan input ulang perubahan Anda.");
    } catch(e) {
      setSyncStatus("error"); setSyncMsg("Gagal muat data terbaru: "+String(e));
    }
  };

  const handleManualRetry = () => { doAutoSave(0); };

  const showToast = (msg, type="success") => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),3500);
  };

  const filtered = transaksi.filter(t=>{
    const d=new Date(t.tanggal);
    return d.getMonth()+1===filter.bulan && d.getFullYear()===filter.tahun;
  });

  const totM       = filtered.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const totBeliAset= filtered.filter(t=>t.jenis==="Pengeluaran"&&t.kategori===KATEGORI_BELI_ASET).reduce((s,t)=>s+t.jumlah,0);
  const totK       = filtered.filter(t=>t.jenis==="Pengeluaran"&&t.kategori!==KATEGORI_BELI_ASET).reduce((s,t)=>s+t.jumlah,0);
  const totKKas    = totK + totBeliAset; // total kas keluar (untuk saldo dashboard)
  // Penyusutan bulan berjalan (laba rugi bulanan) - pakai bulan & tahun filter + usia pakai
  const totPenyAset = aset.filter(a=>a.jenis==="tetap"||!a.jenis).reduce((s,a)=>{
    if(!a.penyusutan) return s;
    if(!a.tanggalBeli) return s + a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    const thn = filter.tahun, bln = filter.bulan-1;
    if(thn < beli.getFullYear()) return s;
    if(thn===beli.getFullYear() && bln<beli.getMonth()) return s;
    if(a.usiaPakai>0) {
      const bulanSejakBeli = (thn-beli.getFullYear())*12 + (bln-beli.getMonth());
      if(bulanSejakBeli >= a.usiaPakai) return s; // usia pakai habis
    }
    return s + a.penyusutan;
  }, 0);
  // Laba rugi bulan berjalan (filter aktif)
  const labaKas   = totM - totK;               // tanpa penyusutan (laba kas)
  const labaRugi  = totM - totK - totPenyAset; // dengan penyusutan (laba akuntansi)
  // Tingkat hunian berdasarkan filter bulan — kamar aktif pada periode filter
  const awalBulan = new Date(filter.tahun, filter.bulan-1, 1);      // 1 [bulan filter]
  const akhirBulan = new Date(filter.tahun, filter.bulan, 0);       // hari terakhir [bulan filter]
  akhirBulan.setHours(23,59,59,999);
  const kamarAktifBulan = kamar.filter(k=>{
    if(!k.masuk) return false;                                       // belum ada tanggal masuk
    const tglMasuk = new Date(k.masuk);
    tglMasuk.setHours(0,0,0,0);
    if(tglMasuk > akhirBulan) return false;                         // belum masuk di bulan ini
    if(k.akhirSewa) {
      const tglAkhir = new Date(k.akhirSewa);
      tglAkhir.setHours(23,59,59,999);
      if(tglAkhir < awalBulan) return false;                        // sudah keluar sebelum bulan ini
    }
    return true;
  });
  const kamarTerisi = kamarAktifBulan.length;

  // ── Kalkulasi Neraca ──────────────────────────────────────────────────────
  const nTahun = filterNeraca.tahun;
  const nBulan = filterNeraca.bulan; // 1-12
  const nBln0  = nBulan - 1;        // 0-based

  // Aset tetap yang sudah dibeli s/d bulan neraca
  const asetTetapList = aset.filter(a=>{
    if(a.jenis==="lancar") return false;
    if(!a.tanggalBeli) return true;
    const beli = new Date(a.tanggalBeli);
    if(beli.getFullYear() > nTahun) return false;
    if(beli.getFullYear() === nTahun && beli.getMonth() > nBln0) return false;
    return true;
  });
  // Modal Awal = Modal Pemilik (diinput manual, fixed)
  const totKwj            = kewajiban.reduce((s,k)=>s+k.jumlah,0);
  const modalAwal         = modalPemilik - totKwj;

  // Helper: penyusutan 1 aset untuk bulan bln (0-11) di tahun thn
  const penyAsetBulan = (a, thn, bln) => {
    if(!a.penyusutan || a.jenis==="lancar") return 0;
    if(!a.tanggalBeli) return a.penyusutan;
    const beli = new Date(a.tanggalBeli);
    const beliThn = beli.getFullYear(), beliBln = beli.getMonth();
    if(thn < beliThn || (thn===beliThn && bln<beliBln)) return 0;
    if(a.usiaPakai > 0) {
      const bulanSejakBeli = (thn - beliThn)*12 + (bln - beliBln);
      if(bulanSejakBeli >= a.usiaPakai) return 0;
    }
    return a.penyusutan;
  };

  // Penyusutan semua aset tetap untuk 1 tahun penuh (Jan-Des)
  const totPenyTahun = (thn) => {
    let s = 0;
    for(let b=0; b<12; b++) s += asetTetapList.reduce((t,a)=>t+penyAsetBulan(a,thn,b),0);
    return s;
  };

  // Penyusutan semua aset tetap s/d bulan tertentu di tahun tertentu (Jan s/d bulan ke-bln, 1-based)
  const totPenySDbulan = (thn, bln) => {
    let s = 0;
    for(let b=0; b<bln; b++) s += asetTetapList.reduce((t,a)=>t+penyAsetBulan(a,thn,b),0);
    return s;
  };

  // Helper filter transaksi berdasarkan jenis laporan
  const filterRek = (arr, jenis) => jenis==="almarwa" ? arr.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa") : arr;

  // Tahun-tahun yang ada data transaksi
  const tahunNeracaList = [...new Set(transaksi.map(t=>new Date(t.tanggal).getFullYear()))].sort();

  // Laba/Rugi s/d bulan terpilih di tahun terpilih (sesuai jenisNeraca)
  const trSDbulan = filterRek(transaksi.filter(t=>{
    const d = new Date(t.tanggal);
    return d.getFullYear()===nTahun && d.getMonth()+1<=nBulan;
  }), jenisNeraca);
  const mSDbulan    = trSDbulan.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
  const kSDbulan    = trSDbulan.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
  const penySDbulan = totPenySDbulan(nTahun, nBulan);
  const labaSDbulan = mSDbulan - kSDbulan - penySDbulan;

  const labaTahunIni = labaSDbulan;

  // Akumulasi laba ditahan tahun-tahun sebelumnya (sesuai jenisNeraca)
  const tahunSebelum    = tahunNeracaList.filter(y=>y<nTahun);
  const akumLabaDitahan = tahunSebelum.reduce((acc,thn)=>{
    const tr = filterRek(transaksi.filter(t=>new Date(t.tanggal).getFullYear()===thn), jenisNeraca);
    const m  = tr.filter(t=>t.jenis==="Pemasukan").reduce((s,t)=>s+t.jumlah,0);
    const k  = tr.filter(t=>t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
    return acc + (m - k - totPenyTahun(thn));
  }, 0);

  const ekuitas = modalAwal + akumLabaDitahan + labaSDbulan;

  const handleSaveTransaksi = () => {
    if(!form.tanggal||!form.jenis||!form.kategori||!form.jumlah){showToast("Lengkapi semua field!","error");return;}
    const data = {
      tanggal:form.tanggal, jenis:form.jenis, kategori:form.kategori,
      deskripsi:form.deskripsi||"-", jumlah:Number(form.jumlah),
      kamar:form.kamar||"", rekening:form.rekening||"Al Marwa",
      bukti:form.bukti||null, buktiNama:form.buktiNama||null,
      buktiThumb:form.buktiThumb||null, buktiDrive:form.buktiDrive||false,
      buktiId:form.buktiId||null,
    };
    if(form._editId){
      setTransaksi(p=>p.map(t=>t.id===form._editId?{...t,...data}:t));
      showToast("✓ Transaksi berhasil diperbarui!");
    } else {
      setTransaksi(p=>[{id:Date.now(),...data},...p]);
      showToast("✓ Transaksi berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const openEditTransaksi = (t) => {
    setForm({_editId:t.id, tanggal:t.tanggal, jenis:t.jenis, kategori:t.kategori,
      jumlah:t.jumlah, deskripsi:t.deskripsi, kamar:t.kamar||"",
      rekening:t.rekening||"Al Marwa",
      bukti:t.bukti||null, buktiNama:t.buktiNama||null,
      buktiThumb:t.buktiThumb||null, buktiDrive:t.buktiDrive||false,
      buktiId:t.buktiId||null,
    });
    setModal("transaksi");
  };
  const handleUploadBukti = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const MAX = 10 * 1024 * 1024; // 10 MB
    if(file.size > MAX){ showToast("File terlalu besar! Maksimal 10 MB","error"); e.target.value=""; return; }

    // Jika sudah login Google → upload ke Drive
    if(gsSignedIn && window.gsDriveUpload) {
      showToast("⏳ Mengupload ke Google Drive...", "info");
      try {
        const result = await window.gsDriveUpload(file);
        setForm(f=>({...f,
          bukti:     result.viewUrl,   // URL Google Drive
          buktiNama: result.nama,
          buktiThumb:result.thumbUrl,  // thumbnail URL
          buktiDrive:true,             // flag: ini dari Drive bukan base64
          buktiId:   result.fileId,
        }));
        showToast("✓ Bukti tersimpan ke Google Drive!");
      } catch(err) {
        showToast("Gagal upload ke Drive: "+String(err),"error");
        console.error(err);
      }
    } else {
      // Fallback: simpan base64 lokal (jika belum login)
      const reader = new FileReader();
      reader.onload = (ev) => {
        setForm(f=>({...f, bukti:ev.target.result, buktiNama:file.name, buktiThumb:null, buktiDrive:false}));
        showToast("✓ Bukti disimpan lokal. Login Google agar tersimpan permanen.");
      };
      reader.readAsDataURL(file);
    }
    e.target.value="";
  };
  const handleSaveKamar = () => {
    if(!form.nomor||!form.harga){showToast("Lengkapi data kamar!","error");return;}
    const data = {
      nomor:form.nomor, penghuni:form.penghuni||"-",
      harga:Number(form.harga), status:form.penghuni&&form.penghuni!=="-"?"Terisi":"Kosong",
      masuk:form.masuk||"", akhirSewa:form.akhirSewa||"", telepon:form.telepon||""
    };
    if(form._editId) {
      setKamar(p=>p.map(k=>k.id===form._editId?{...k,...data}:k));
      showToast("✓ Data kamar berhasil diperbarui!");
    } else {
      setKamar(p=>[...p,{id:Date.now(),...data}]);
      showToast("✓ Kamar berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const handleSaveAset = () => {
    if(!form.nama||!form.nilai){showToast("Lengkapi nama dan nilai aset!","error");return;}
    const usiaPakai = Number(form.usiaPakai||0);
    // Penyusutan dihitung otomatis: nilai ÷ usia pakai (bulan). Manual hanya sebagai fallback.
    const penyusutan = (form.jenis==="tetap" && usiaPakai>0)
      ? Math.round(Number(form.nilai)/usiaPakai)
      : Number(form.penyusutan||0);
    if(form._editId) {
      setAset(p=>p.map(a=>a.id===form._editId?{...a,nama:form.nama,nilai:Number(form.nilai),penyusutan,usiaPakai,jenis:form.jenis||"tetap",keterangan:form.keterangan||"",tanggalBeli:form.tanggalBeli||""}:a));
      showToast("✓ Aset berhasil diperbarui!");
    } else {
      setAset(p=>[...p,{id:Date.now(),nama:form.nama,nilai:Number(form.nilai),penyusutan,usiaPakai,jenis:form.jenis||"tetap",keterangan:form.keterangan||"",tanggalBeli:form.tanggalBeli||""}]);
      showToast("✓ Aset berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };
  const handleSaveKwj = () => {
    if(!form.nama||!form.jumlah){showToast("Lengkapi nama dan jumlah!","error");return;}
    if(form._editId) {
      setKewajiban(p=>p.map(k=>k.id===form._editId?{...k,nama:form.nama,jumlah:Number(form.jumlah),cicilan:Number(form.cicilan||0)}:k));
      showToast("✓ Kewajiban berhasil diperbarui!");
    } else {
      setKewajiban(p=>[...p,{id:Date.now(),nama:form.nama,jumlah:Number(form.jumlah),cicilan:Number(form.cicilan||0)}]);
      showToast("✓ Kewajiban berhasil ditambahkan!");
    }
    setModal(null);setForm({});
  };

  const exportCSV = () => {
    const h="Tanggal,Jenis,Kategori,Deskripsi,Jumlah,Kamar\n";
    const rows=filtered.map(t=>`${t.tanggal},${t.jenis},${t.kategori},"${t.deskripsi}",${t.jumlah},${t.kamar}`).join("\n");
    const blob=new Blob([h+rows],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`Transaksi_Almarwa_${filter.bulan}_${filter.tahun}.csv`;a.click();
    showToast("✓ CSV berhasil diexport!");
  };

  const exportAllData = () => {
    const data = {transaksi,kamar,aset,kewajiban,exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a = document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`Backup_Almarwa_${today()}.json`;a.click();
    showToast("✓ Backup data berhasil didownload!");
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.transaksi) setTransaksi(data.transaksi);
        if(data.kamar) setKamar(data.kamar);
        if(data.aset) setAset(data.aset);
        if(data.kewajiban) setKewajiban(data.kewajiban);
        showToast("✓ Data berhasil diimpor!");
      } catch { showToast("File tidak valid!","error"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const TABS = [
    {id:"dashboard",label:"Dashboard",icon:"🏠"},
    {id:"transaksi",label:"Transaksi",icon:"💳"},
    {id:"kamar",label:"Data Kamar",icon:"🚪"},
    {id:"aset",label:"Aset & Kewajiban",icon:"🏢"},
    {id:"laba-rugi",label:"Laba Rugi",icon:"📊"},
    {id:"neraca",label:"Neraca",icon:"⚖️"},
    {id:"tahunan",label:"Laporan Tahunan",icon:"📅"},
    {id:"backup",label:"Backup/Restore",icon:"💾"},
  ];

  return (
    <div className="app">
      <header className="header">
        <div className="header-brand">
          <span className="header-icon">🌸</span>
          <div>
            <div className="header-title">Kos Putri Almarwa</div>
            <div className="header-sub">Sistem Pembukuan Usaha</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {/* Indikator Sync Status */}
          {gsSignedIn && (
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",
              borderRadius:20,fontSize:11,fontWeight:600,
              background:syncStatus==="error"||syncStatus==="conflict"?"rgba(200,115,106,0.25)":
                         syncStatus==="saved"?"rgba(90,230,120,0.15)":"rgba(253,246,238,0.1)",
              color:syncStatus==="error"||syncStatus==="conflict"?"#F2A39D":
                    syncStatus==="saved"?"#5AE678":"rgba(253,246,238,0.75)",
              border:"1px solid rgba(253,246,238,0.15)"}}>
              {(syncStatus==="saving"||syncStatus==="pending"||syncStatus==="retrying") && <>⏳ {syncMsg||"Menyimpan..."}</>}
              {syncStatus==="saved"    && <>🟢 Tersimpan {syncTime?.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</>}
              {syncStatus==="error"    && <span style={{cursor:"pointer"}} onClick={handleManualRetry}>🔴 Gagal · Klik Coba Lagi</span>}
              {syncStatus==="conflict" && <span style={{cursor:"pointer"}} onClick={()=>setModal("syncConflict")}>⚠️ Konflik Data</span>}
              {syncStatus==="idle"     && <>☁️ Terhubung</>}
            </div>
          )}
          <div className="sync-badge" onClick={()=>setTab("backup")}>
            {gsSignedIn?"✓ Google Sheets":"☁️ Google Sheets"}
          </div>
        </div>
      </header>

      <nav className="nav">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-btn${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
            <span>{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>

      {/* Banner peringatan belum login */}
      {!gsSignedIn && (
        <div style={{background:"#FFF3E0",borderBottom:"2px solid #FFCC80",padding:"8px 24px",
          display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#E65100"}}>
            <span style={{fontSize:18}}>⚠️</span>
            <span>

                {(()=>{

                  const n=kamar.filter(k=>{
                    if(!k.akhirSewa||k.status!=="Terisi") return false;
                    return selisihHari(k.akhirSewa,tod)!==null&&selisihHari(k.akhirSewa,tod)<=5;

                  return n>0?<span style={{color:"#E65100",fontWeight:700}}> · {n} jatuh tempo</span>:null;
                })()}
              </div>
            </div>
          </div>

          {/* KARTU REKENING — akumulasi s/d bulan terpilih */}

            // Transaksi s/d bulan & tahun filter (akumulasi)
            const sdBulan = transaksi.filter(t=>{
              const d=new Date(t.tanggal);
              return d.getFullYear()<filter.tahun ||(d.getFullYear()===filter.tahun && d.getMonth()+1<=filter.bulan);
            });
            const rek = (nama,jenis) => sdBulan
              .filter(t=>(t.rekening||"Al Marwa")===nama && t.jenis===jenis)
              .reduce((s,t)=>s+t.jumlah,0);
            // Saldo kas = semua pendapatan - semua pengeluaran kas (termasuk beli aset)
            const amIn=rek("Al Marwa","Pemasukan");
            const amOut=sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa"&&t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
            const amOutOps=sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa"&&t.jenis==="Pengeluaran"&&t.kategori!==KATEGORI_BELI_ASET).reduce((s,t)=>s+t.jumlah,0);

            const prIn=rek("Pribadi","Pemasukan");
            const prOut=sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Pribadi"&&t.jenis==="Pengeluaran").reduce((s,t)=>s+t.jumlah,0);
            const saldoAM = amIn - amOut;
            const saldoPr = prIn - prOut;

            // Penyusutan s/d bulan filter (untuk laba akuntansi Al Marwa)
            let penySDfilt = 0;
            for(let b=0; b<filter.bulan; b++) {
              penySDfilt += asetTetapList.reduce((s,a)=>s+penyAsetBulan(a,filter.tahun,b),0);

            // Laba akuntansi Al Marwa = Saldo Kas Al Marwa - Penyusutan s/d bulan
            const labaAkuntansiAM = saldoAM - penySDfilt;
            // PPh 31E = 11% × laba akuntansi Al Marwa (hanya jika laba > 0)
            const pphAM = labaAkuntansiAM > 0 ? Math.round(labaAkuntansiAM * 0.11) : 0;
            const saldoAMsetelahPajak = saldoAM - pphAM;
            // Total saldo gabungan
            const totalSaldo = saldoAMsetelahPajak + saldoPr;

            const labelPeriode = `s/d ${BULAN[filter.bulan-1]} ${filter.tahun}`;
            const dataAMIn  = sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa"&&t.jenis==="Pemasukan");
            const dataAMOut = sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Al Marwa"&&t.jenis==="Pengeluaran");
            const dataPrIn  = sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Pribadi"&&t.jenis==="Pemasukan");
            const dataPrOut = sdBulan.filter(t=>(t.rekening||"Al Marwa")==="Pribadi"&&t.jenis==="Pengeluaran");
            const Card = ({label,val,sub,color,icon,onClick,data}) => (
              <div className="stat-card" style={{borderTop:`3px solid ${color}`,cursor:onClick?"pointer":"default"}}

                <div className="stat-value" style={{color,fontSize:20}}>{fmt(Math.abs(val))}</div>
                <div className="stat-sub">{sub}{onClick?<span style={{fontSize:10,opacity:0.6,marginLeft:4}}>· klik rincian ↗</span>:null}</div>
              </div>
            );
            return (<>
              {/* Header pemisah */}
              <div style={{display:"flex",alignItems:"center",gap:12,margin:"8px 0 12px"}}>
                <div style={{height:1,flex:1,background:"var(--border)"}}/>
                <span style={{fontSize:12,fontWeight:700,color:"var(--text-soft)",textTransform:"uppercase",letterSpacing:"1px"}}>
                  Rekap Rekening {labelPeriode}

                <div style={{height:1,flex:1,background:"var(--border)"}}/>
              </div>

              {/* Rekening Al Marwa — 5 kartu */}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--burgundy)",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>
                  🏦 Rekening Al Marwa
                </div>
                {/* Baris 1: 4 kartu sejajar */}
                <div className="stat-grid" style={{marginBottom:8}}>
                  <Card label="Pendapatan Al Marwa"  val={amIn}   sub={labelPeriode} color="var(--green)" icon="▲" onClick={()=>setModalRincian({jenis:"Pemasukan",data:dataAMIn,label:"Al Marwa"})}/>
                  <Card label="Pengeluaran Al Marwa" val={amOut}  sub={labelPeriode} color="var(--rose)"  icon="▼" onClick={()=>setModalRincian({jenis:"Pengeluaran",data:dataAMOut,label:"Al Marwa"})}/>
                  <div className="stat-card" style={{borderTop:`3px solid ${saldoAM>=0?"var(--green)":"var(--rose)"}`}}>
                    <div className="stat-label">🏦 Saldo Al Marwa (Kas)</div>
                    <div className="stat-value" style={{color:saldoAM>=0?"var(--green)":"var(--rose)",fontSize:20}}>{fmt(Math.abs(saldoAM))}</div>
                    <div className="stat-sub">
                      {saldoAM>=0?"✓ Surplus":"✗ Defisit"} · {labelPeriode}
                      {amBeliAset>0&&<span style={{color:"var(--gold)",marginLeft:4}}>· Beli aset {fmt(amBeliAset)}</span>}
                    </div>
                  </div>
                  <div className="stat-card" style={{borderTop:"3px solid #1565C0"}}>
                    <div className="stat-label" style={{color:"#1565C0"}}>🏛️ PPh Pasal 31E (11%)</div>
                    <div className="stat-value" style={{color:"#1565C0",fontSize:20}}>{fmt(pphAM)}</div>
                    <div className="stat-sub">
                      {pphAM>0
                        ? `11% × Laba Akuntansi ${fmt(labaAkuntansiAM)}`
                        : labaAkuntansiAM<=0?"Tidak ada pajak (rugi/impas)":"—"}
                    </div>
                  </div>
                </div>
                {/* Baris 2: Saldo Setelah Pajak — lebar penuh */}
                <div className="stat-card" style={{
                  borderTop:`3px solid ${saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)"}`,
                  display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12
                }}>
                  <div>
                    <div className="stat-label" style={{color:saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)"}}>✅ Saldo Al Marwa Setelah Pajak</div>
                    <div className="stat-value" style={{color:saldoAMsetelahPajak>=0?"#0D47A1":"var(--rose)",fontSize:24,marginTop:4}}>{fmt(Math.abs(saldoAMsetelahPajak))}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="stat-sub" style={{marginBottom:4}}>{saldoAMsetelahPajak>=0?"✓ Bersih setelah PPh":"✗ Defisit"} · {labelPeriode}</div>
                    <div style={{fontSize:11,color:"var(--text-soft)"}}>Saldo Kas {fmt(saldoAM)} − PPh {fmt(pphAM)}</div>
                  </div>
                </div>
              </div>

              {/* Rekening Pribadi — 3 kartu */}
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--green)",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>

                  <Card label="Pengeluaran Pribadi" val={prOut}  sub={labelPeriode} color="var(--rose)"  icon="▼" onClick={()=>setModalRincian({jenis:"Pengeluaran",data:dataPrOut,label:"Pribadi"})}/>

                    <div className="stat-label">👤 Saldo Pribadi</div>
                    <div className="stat-value" style={{color:saldoPr>=0?"var(--green)":"var(--rose)",fontSize:20}}>{fmt(Math.abs(saldoPr))}</div>
                    <div className="stat-sub">{saldoPr>=0?"✓ Surplus":"✗ Defisit"} · {labelPeriode}</div>
                  </div>
                </div>
              </div>

              {/* CARD TOTAL SALDO — menonjol */}
              <div style={{
                background:"linear-gradient(135deg,var(--burgundy) 0%,#5C1A28 100%)",
                borderRadius:18, padding:"24px 28px", marginBottom:8,
                boxShadow:"0 8px 32px rgba(123,45,62,0.35)",
                display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:16
              }}>
                <div>
                  <div style={{color:"rgba(253,246,238,0.7)",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:6}}>
                    🏦 Total Saldo Gabungan — Rekap {labelPeriode}
                  </div>
                  <div style={{color:"var(--cream)",fontSize:32,fontWeight:700,fontFamily:"'Playfair Display',serif",letterSpacing:"-0.5px"}}>
                    {fmt(totalSaldo)}
                  </div>
                  <div style={{color:"rgba(253,246,238,0.65)",fontSize:12,marginTop:6,display:"flex",gap:16,flexWrap:"wrap"}}>
                    <span>✅ Al Marwa Setelah Pajak: <strong style={{color:"var(--cream)"}}>{fmt(saldoAMsetelahPajak)}</strong></span>
                    <span>+</span>
                    <span>👤 Pribadi: <strong style={{color:"var(--cream)"}}>{fmt(saldoPr)}</strong></span>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:"rgba(253,246,238,0.6)",fontSize:11,marginBottom:4}}>Status</div>
                  <div style={{
                    padding:"8px 20px", borderRadius:20,
                    background:totalSaldo>=0?"rgba(90,230,120,0.2)":"rgba(200,115,106,0.2)",
                    color:totalSaldo>=0?"#5AE678":"#F2A39D",
                    fontWeight:700, fontSize:14
                  }}>
                    {totalSaldo>=0?"✓ Surplus":"✗ Defisit"}
                  </div>
                </div>
              </div>
            </>);
          })()}

          <div className="card">
            <div className="card-title">💳 Transaksi Terbaru</div>
            <TransaksiTable data={filtered.slice(0,8)} onEdit={openEditTransaksi} onDelete={id=>{setTransaksi(p=>p.filter(t=>t.id!==id));showToast("Transaksi dihapus","info");}} short/>
          </div>
        </>)}

        {/* TRANSAKSI */}
        {modalRincian && <ModalRincian info={modalRincian} onClose={()=>setModalRincian(null)} bulan={filter.bulan} tahun={filter.tahun}/>}

        {tab==="transaksi" && (()=>{
          // Terapkan filter tambahan (jenis/kategori/rekening/kamar) di atas filtered yg sudah by bulan
          const filteredT = filtered.filter(t=>{
            if(filterTransaksi.jenis && t.jenis!==filterTransaksi.jenis) return false;
            if(filterTransaksi.kategori && t.kategori!==filterTransaksi.kategori) return false;
            if(filterTransaksi.rekening && (t.rekening||"Al Marwa")!==filterTransaksi.rekening) return false;
            if(filterTransaksi.kamar && t.kamar!==filterTransaksi.kamar) return false;
            return true;
          });
          return (<>
          <FilterBar filter={filter} setFilter={setFilter}/>
          <TransaksiFilterBar transaksi={filtered} filter={filterTransaksi} setFilter={setFilterTransaksi}/>
          <div className="card">
            <div className="section-header">
              <div className="card-title" style={{marginBottom:0}}>💳 Daftar Transaksi</div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {sortTransaksi.col&&<span style={{fontSize:11,color:"var(--text-soft)"}}>Sort: {sortTransaksi.col} {sortTransaksi.dir===1?"▲":"▼"}</span>}
                <button className="btn btn-secondary btn-sm" onClick={exportCSV}>📥 Export CSV</button>
                <button className="btn btn-primary btn-sm" onClick={()=>{setForm({tanggal:today(),jenis:"Pemasukan"});setModal("transaksi");}}>+ Tambah</button>
              </div>
            </div>
            <hr className="divider"/>
            <TransaksiTable data={filteredT} onEdit={openEditTransaksi}
              onDelete={id=>{setTransaksi(p=>p.filter(t=>t.id!==id));showToast("Transaksi dihapus","info");}}
              sort={sortTransaksi} setSort={setSortTransaksi}/>
          </div>
          </>);
        })()}

        {/* KAMAR */}
        {tab==="kamar" && (()=>{
          const today2 = new Date(); today2.setHours(0,0,0,0);
          // Kamar yang perlu notifikasi: akhirSewa dalam 5 hari ke depan
          const notifKamar = kamar.filter(k=>{
            if(!k.akhirSewa||k.status!=="Terisi") return false;
            const selisih = selisihHari(k.akhirSewa,today2);
            return selisih>=0 && selisih<=5;
          }).map(k=>{
            const selisih=selisihHari(k.akhirSewa,today2);
            return {...k,selisih};
          });
          return (<>
            {/* NOTIFIKASI */}
            {notifKamar.length>0 && (
              <div style={{marginBottom:20}}>
                {notifKamar.map(k=>(
                  <div key={k.id} style={{
                    display:"flex",alignItems:"flex-start",gap:14,
                    padding:"16px 20px",borderRadius:14,marginBottom:10,
                    background:k.selisih===0?"#FDE8E8":k.selisih<=2?"#FFF3E0":"#FFF8E1",
                    border:`1.5px solid ${k.selisih===0?"#F5B5B5":k.selisih<=2?"#FFCC80":"#FFE082"}`,
                    boxShadow:"0 2px 10px rgba(0,0,0,0.06)"
                  }}>
                    <div style={{fontSize:26,lineHeight:1}}>{k.selisih===0?"🚨":k.selisih<=2?"⚠️":"🔔"}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14,color:k.selisih===0?"#C0392B":k.selisih<=2?"#E65100":"#F57F17",marginBottom:4}}>
                        {k.selisih===0?"HARI INI — Sewa Jatuh Tempo!"
                          :k.selisih===1?"BESOK — Sewa Jatuh Tempo!"
                          :`${k.selisih} Hari Lagi — Sewa Hampir Berakhir`}
                      </div>
                      <div style={{fontSize:13,color:"#5D4037"}}>
                        Kamar <strong>{k.nomor}</strong> — {k.penghuni}
                        <span style={{margin:"0 8px",color:"#BCAAA4"}}>·</span>
                        Sewa berakhir: <strong>{new Date(k.akhirSewa).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</strong>
                        <span style={{margin:"0 8px",color:"#BCAAA4"}}>·</span>
                        Harga: {fmt(k.harga)}/bln
                      </div>
                    </div>
                    <button className="btn btn-sm" style={{background:"var(--burgundy)",color:"white",whiteSpace:"nowrap",flexShrink:0}}
                      onClick={()=>{setForm({_editId:k.id,nomor:k.nomor,penghuni:k.penghuni,harga:k.harga,masuk:k.masuk,akhirSewa:k.akhirSewa,telepon:k.telepon||""});setModal("kamar");}}>
                      ✏️ Perpanjang
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TEMPLATE WA */}
            <TemplateWACard template={templateWA} setTemplate={setTemplateWA}/>

            {/* TABEL KAMAR */}
            <div className="card">
              <div className="section-header">
                <div className="card-title" style={{marginBottom:0}}>🚪 Data Kamar</div>
                <button className="btn btn-primary btn-sm" onClick={()=>{setForm({});setModal("kamar");}}>+ Tambah Kamar</button>
              </div>
              <hr className="divider"/>
              <div className="table-wrap">
                <table>
                  <thead><tr>
                    {[["nomor","No. Kamar"],["penghuni","Penghuni"],["harga","Harga/Bln"],
                      ["status","Status"],["masuk","Tgl Masuk"],["akhirSewa","Akhir Sewa"]].map(([col,label])=>{
                      const active=sortKamar.col===col&&sortKamar.dir!==0;
                      const icon=active?(sortKamar.dir===1?"▲":"▼"):"↕";
                      return (<th key={col} style={{cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"}}
                        onClick={()=>setSortKamar(s=>{
                          if(s.col!==col) return {col,dir:1};
                          if(s.dir===1) return {col,dir:-1};
                          return {col:"",dir:0};
                        })}>
                        {label} <span style={{fontSize:10,opacity:active?1:0.3,color:active?"var(--burgundy)":"inherit"}}>{icon}</span>
                      </th>);
                    })}
                    <th>Sisa</th><th>Aksi</th>
                  </tr></thead>
                  <tbody>
                    {[...kamar].sort((a,b)=>{
                      if(!sortKamar.col||sortKamar.dir===0) return 0;
                      const col=sortKamar.col;
                      let va=a[col]||"", vb=b[col]||"";
                      if(col==="harga"){ return sortKamar.dir*((Number(va)||0)-(Number(vb)||0)); }
                      if(col==="masuk"||col==="akhirSewa"){ return sortKamar.dir*(new Date(va||0)-new Date(vb||0)); }
                      if(col==="nomor"){ return sortKamar.dir*String(va).localeCompare(String(vb),"id",{numeric:true}); }
                      return sortKamar.dir*String(va).localeCompare(String(vb),"id");
                    }).map(k=>{
                      let sisaHari=null, labelSisa=null, warnaTag="var(--text-soft)", bgTag="rgba(0,0,0,0.05)";
                      if(k.akhirSewa&&k.status==="Terisi") sisaHari=selisihHari(k.akhirSewa,today2);
                      if(sisaHari!==null){
                        if(sisaHari<0){labelSisa="Kedaluwarsa";warnaTag="#C0392B";bgTag="rgba(192,57,43,0.1)";}
                        else if(sisaHari===0){labelSisa="Hari ini!";warnaTag="#C0392B";bgTag="rgba(192,57,43,0.1)";}

              <div className="form-group">
                <label>Jenis</label>
                <select value={form.jenis||""} onChange={e=>setForm(f=>({...f,jenis:e.target.value,kategori:""}))}>
                  <option value="Pemasukan">Pemasukan</option>
                  <option value="Pengeluaran">Pengeluaran</option>
                </select>
              </div>
              <div className="form-group">
                <label>Kategori</label>
                <select value={form.kategori||""} onChange={e=>setForm(f=>({...f,kategori:e.target.value}))}>
                  <option value="">-- Pilih --</option>
                  {(form.jenis==="Pemasukan"?KAT_MASUK:KAT_KELUAR).map(k=><option key={k}>{k}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Jumlah (Rp)</label>
                <input type="number" placeholder="0" value={form.jumlah||""} onChange={e=>setForm(f=>({...f,jumlah:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Rekening</label>
                <select value={form.rekening||"Al Marwa"} onChange={e=>setForm(f=>({...f,rekening:e.target.value}))}>
                  <option value="Al Marwa">🏦 Rekening Al Marwa</option>
                  <option value="Pribadi">👤 Rekening Pribadi</option>
                </select>
              </div>
              <div className="form-group">
                <label>Kamar (opsional)</label>
                <select value={form.kamar||""} onChange={e=>setForm(f=>({...f,kamar:e.target.value}))}>
                  <option value="">-- Semua --</option>
                  {kamar.map(k=><option key={k.id} value={k.nomor}>Kamar {k.nomor} - {k.penghuni}</option>)}
                </select>
              </div>
              <div className="form-group full">
                <label>Keterangan</label>
                <textarea placeholder="Deskripsi transaksi..." value={form.deskripsi||""} onChange={e=>setForm(f=>({...f,deskripsi:e.target.value}))}/>
              </div>
              {/* Upload Bukti */}
              <div className="form-group full">
                <label>Bukti / Kuitansi</label>
                <div style={{border:"2px dashed var(--border)",borderRadius:10,padding:"16px",background:"var(--rose-pale)",textAlign:"center",position:"relative"}}>
                  {form.bukti ? (
                    <div style={{display:"flex",alignItems:"center",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
                      {form.bukti.startsWith("data:image") ? (
                        <img src={form.bukti} alt="preview"
                          style={{height:80,maxWidth:200,objectFit:"contain",borderRadius:8,border:"1px solid var(--border)"}}/>
                      ) : (
                        <div style={{fontSize:40}}>📄</div>
                      )}
                      <div style={{textAlign:"left"}}>
                        <div style={{fontSize:13,fontWeight:600,color:"var(--burgundy)"}}>{form.buktiNama||"File terpilih"}</div>
                        <div style={{fontSize:11,color:"var(--text-soft)",marginTop:2}}>Klik tombol di bawah untuk ganti</div>
                      </div>
                      <button type="button" className="btn btn-danger btn-sm"
                        onClick={()=>setForm(f=>({...f,bukti:null,buktiNama:null,buktiThumb:null,buktiDrive:false,buktiId:null}))}>✕ Hapus</button>
                    </div>
                  ) : (
                    <div>
                      <div style={{fontSize:32,marginBottom:6}}>📎</div>
                      <div style={{fontSize:13,color:"var(--text-soft)",marginBottom:6}}>
                        Klik untuk upload bukti/kuitansi
                      </div>
                      <div style={{fontSize:11,color:gsSignedIn?"#1565C0":"var(--gold)"}}>
                        {gsSignedIn?"☁️ File otomatis tersimpan ke Google Drive":"⚠️ Login Google agar bukti tersimpan permanen"}
                      </div>
                      <div style={{fontSize:10,color:"var(--border)",marginTop:4}}>JPG, PNG, PDF — Maks. 10 MB</div>
                    </div>
                  )}
                  <input type="file" accept="image/*,application/pdf"
                    style={{position:"absolute",inset:0,opacity:0,cursor:"pointer",width:"100%",height:"100%"}}
                    onChange={handleUploadBukti}/>
                </div>
                {form.bukti && (
                  <div style={{marginTop:8}}>
                    {form.buktiDrive ? (
                      // File Drive
                      <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",
                        background:"rgba(21,101,192,0.06)",borderRadius:10,border:"1px solid rgba(21,101,192,0.2)"}}>
                        <span style={{fontSize:28}}>☁️</span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:13,color:"#1565C0"}}>{form.buktiNama}</div>
                          <div style={{fontSize:11,color:"var(--text-soft)",marginTop:2}}>Tersimpan di Google Drive</div>
                        </div>
                        <a href={form.bukti} target="_blank" rel="noopener noreferrer"
                          className="btn btn-secondary btn-sm">🔗 Buka</a>
                      </div>
                    ) : form.bukti.startsWith("data:image") ? (
                      <div style={{textAlign:"center"}}>
                        <img src={form.bukti} alt="preview"
                          style={{maxWidth:"100%",maxHeight:200,objectFit:"contain",
                            borderRadius:10,border:"1px solid var(--border)",marginBottom:8}}/>
                        <div style={{fontSize:11,color:"var(--gold)"}}>
                          ⚠️ File lokal — Login Google agar tersimpan permanen di Drive
                        </div>
                      </div>
                    ) : (
                      <div style={{display:"flex",gap:8}}>
                        <a href={form.bukti} download={form.buktiNama||"bukti"} className="btn btn-secondary btn-sm">
                          📥 Download PDF
                        </a>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Batal</button>
              <button className="btn btn-primary" onClick={handleSaveTransaksi}>✓ {form._editId?"Perbarui":"Simpan"}</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL KAMAR */}
      {modal==="kamar" && (
        <div className="modal-overlay" >
          <div className="modal">
            <div className="modal-title">🚪 {form._editId?"Edit Data Kamar":"Tambah Kamar"}</div>
            <div className="form-grid">
              <div className="form-group">
                <label>Nomor Kamar</label>
                <input placeholder="mis: 103" value={form.nomor||""} onChange={e=>setForm(f=>({...f,nomor:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Harga/Bulan (Rp)</label>
                <input type="number" placeholder="0" value={form.harga||""} onChange={e=>setForm(f=>({...f,harga:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Nama Penghuni</label>
                <input placeholder="(kosongkan jika kosong)" value={form.penghuni||""} onChange={e=>setForm(f=>({...f,penghuni:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>No. HP / WhatsApp</label>
                <input placeholder="mis: 08123456789" value={form.telepon||""} onChange={e=>setForm(f=>({...f,telepon:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Tanggal Masuk</label>
                <input type="date" value={form.masuk||""} onChange={e=>setForm(f=>({...f,masuk:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Tanggal Akhir Sewa</label>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input type="date" value={form.akhirSewa||""} onChange={e=>setForm(f=>({...f,akhirSewa:e.target.value}))} style={{flex:1}}/>
                  {form.akhirSewa && (
                    <button type="button" className="btn btn-secondary btn-sm" style={{whiteSpace:"nowrap"}} onClick={()=>{
                      const d=new Date(form.akhirSewa);
                      d.setMonth(d.getMonth()+1);
                      setForm(f=>({...f,akhirSewa:d.toISOString().slice(0,10)}));
                    }}>+1 Bln</button>
                  )}
                  {form.akhirSewa && (
                    <button type="button" className="btn btn-secondary btn-sm" style={{whiteSpace:"nowrap"}} onClick={()=>{
                      const d=new Date(form.akhirSewa);
                      d.setMonth(d.getMonth()+6);
                      setForm(f=>({...f,akhirSewa:d.toISOString().slice(0,10)}));
                    }}>+6 Bln</button>
                  )}
                </div>
              </div>
              {form.akhirSewa && (()=>{
                const akhir=new Date(form.akhirSewa); akhir.setHours(0,0,0,0);
                const tod=new Date(); tod.setHours(0,0,0,0);
                const sisa=selisihHari(form.akhirSewa,tod);
                const warna=sisa<0?"var(--rose)":sisa<=5?"#E65100":sisa<=30?"var(--gold)":"var(--green)";
                return <div className="form-group" style={{background:"var(--rose-pale)",borderRadius:10,padding:"10px 14px"}}>
                  <label>Info Sewa</label>
                  <div style={{fontWeight:600,color:warna,fontSize:13,marginTop:4}}>
                    {sisa<0?`⚠️ Sudah kedaluwarsa ${Math.abs(sisa)} hari`
                      :sisa===0?"🚨 Berakhir hari ini!"
                      :sisa<=5?`⚠️ ${sisa} hari lagi — segera perpanjang`
                      :`✓ Sisa ${sisa} hari (${Math.floor(sisa/30)} bln ${sisa%30} hari)`}
                  </div>
                  <div style={{fontSize:11,color:"var(--text-soft)",marginTop:2}}>
                    Notifikasi otomatis akan muncul 5 hari sebelum berakhir
                  </div>
                </div>;
              })()}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Batal</button>
              <button className="btn btn-primary" onClick={handleSaveKamar}>✓ {form._editId?"Perbarui":"Simpan"}</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL ASET */}
      {modal==="aset" && (
        <div className="modal-overlay" >
          <div className="modal">
            <div className="modal-title">🏢 {form._editId?"Edit Aset":"Tambah Aset"}</div>
            <div className="form-grid">
              <div className="form-group full">
                <label>Nama Aset</label>
                <input placeholder="mis: Bangunan Kos, Furnitur, AC..." value={form.nama||""} onChange={e=>setForm(f=>({...f,nama:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Jenis Aset</label>
                <select value={form.jenis||"tetap"} onChange={e=>setForm(f=>({...f,jenis:e.target.value}))}>
                  <option value="lancar">💧 Aset Lancar</option>
                  <option value="tetap">🏛️ Aset Tetap</option>
                </select>
              </div>
              <div className="form-group">
                <label>Nilai Aset (Rp)</label>
                <input type="number" placeholder="0" value={form.nilai||""} onChange={e=>setForm(f=>({...f,nilai:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Tanggal Pembelian</label>
                <input type="date" value={form.tanggalBeli||""} onChange={e=>setForm(f=>({...f,tanggalBeli:e.target.value}))}/>
              </div>
              {(form.jenis==="tetap"||!form.jenis) && (<>
                <div className="form-group">
                  <label>Usia Pakai (bulan)</label>
                  <input type="number" placeholder="mis: 240 = 20 thn, 60 = 5 thn" value={form.usiaPakai||""} onChange={e=>setForm(f=>({...f,usiaPakai:e.target.value}))}/>
                </div>
                <div className="form-group" style={{background:"var(--rose-pale)",borderRadius:10,padding:"10px 14px"}}>
                  <label>Penyusutan/Bulan (otomatis)</label>
                  <div style={{fontSize:16,fontWeight:700,color:"var(--burgundy)",marginTop:4}}>
                    {form.nilai && form.usiaPakai && Number(form.usiaPakai)>0
                      ? fmt(Math.round(Number(form.nilai)/Number(form.usiaPakai)))
                      : <span style={{color:"var(--text-soft)",fontWeight:400,fontSize:13}}>Isi nilai & usia pakai</span>
                    }
                  </div>
                  {form.tanggalBeli && form.usiaPakai && Number(form.usiaPakai)>0 && (() => {
                    const beli = new Date(form.tanggalBeli);
                    const selesai = new Date(beli);
                    selesai.setMonth(selesai.getMonth() + Number(form.usiaPakai));
                    return <div style={{fontSize:11,color:"var(--text-soft)",marginTop:2}}>
                      Selesai disusutkan: {selesai.toLocaleDateString("id-ID",{year:"numeric",month:"long"})}
                      {" · "}{Math.floor(Number(form.usiaPakai)/12)} tahun {Number(form.usiaPakai)%12} bulan
                    </div>;
                  })()}
                </div>
              </>)}
              <div className="form-group full">
                <label>Keterangan</label>
                <textarea placeholder="mis: Lokasi, kondisi, tahun beli, nomor seri, dll..." value={form.keterangan||""} onChange={e=>setForm(f=>({...f,keterangan:e.target.value}))}/>
              </div>
            </div>
            <div style={{background:"var(--gold-light)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"var(--gold)",marginTop:12}}>
              💡 <strong>Usia Pakai</strong> menentukan berapa lama aset disusutkan. Penyusutan = Nilai ÷ Usia Pakai (bulan), berhenti otomatis setelah lunas. Contoh: bangunan 20 tahun = 240 bulan, furnitur 5 tahun = 60 bulan.
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Batal</button>
              <button className="btn btn-primary" onClick={handleSaveAset}>✓ {form._editId?"Perbarui":"Simpan"}</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL KEWAJIBAN */}
      {modal==="kewajiban" && (
        <div className="modal-overlay" >
          <div className="modal">
            <div className="modal-title">📋 {form._editId?"Edit Kewajiban":"Tambah Kewajiban"}</div>
            <div className="form-grid">
              <div className="form-group full">
                <label>Nama Kewajiban</label>
                <input placeholder="mis: Pinjaman Bank, Deposit Penghuni..." value={form.nama||""} onChange={e=>setForm(f=>({...f,nama:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Jumlah Utang (Rp)</label>
                <input type="number" placeholder="0" value={form.jumlah||""} onChange={e=>setForm(f=>({...f,jumlah:e.target.value}))}/>
              </div>
              <div className="form-group">
                <label>Cicilan/Bulan (Rp)</label>
                <input type="number" placeholder="0 (opsional)" value={form.cicilan||""} onChange={e=>setForm(f=>({...f,cicilan:e.target.value}))}/>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Batal</button>
              <button className="btn btn-primary" onClick={handleSaveKwj}>✓ {form._editId?"Perbarui":"Simpan"}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL STARTUP: NOTIF LOGIN ──────────────────────────────────── */}
      {startupModal==="login" && (
        <div className="modal-overlay" style={{zIndex:400}}>
          <div className="modal" style={{maxWidth:440}}>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:48,marginBottom:8}}>☁️</div>
              <div className="modal-title" style={{justifyContent:"center",marginBottom:8}}>
                Login Google Disarankan
              </div>
              <p style={{color:"var(--text-soft)",fontSize:13,lineHeight:1.7}}>
                Anda belum terhubung ke Google Sheets.<br/>
                Data yang ditampilkan adalah <strong>data lokal browser ini</strong>.<br/>
                Login untuk sinkronisasi otomatis dengan Google Sheets.
              </p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button className="btn btn-primary" style={{justifyContent:"center"}} onClick={async()=>{
                setStartupModal(null);
                try {
                  await window.gsSignIn();
                  setGsSignedIn(true);
                  showToast("✓ Berhasil login Google!");
                  runStartupCheck();
                } catch(e){ showToast("Gagal login: "+String(e),"error"); }
              }}>🔑 Login Google Sekarang</button>
              <button className="btn btn-secondary" style={{justifyContent:"center"}}
                onClick={()=>setStartupModal(null)}>
                ⏭️ Lanjut Tanpa Login (pakai data lokal)
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL STARTUP: SHEETS KOSONG, LOKAL ADA DATA ───────────────── */}
      {startupModal==="uploadLokal" && (
        <div className="modal-overlay" style={{zIndex:400}}>
          <div className="modal" style={{maxWidth:460}}>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:48,marginBottom:8}}>📤</div>
              <div className="modal-title" style={{justifyContent:"center",marginBottom:8}}>
                Google Sheets Masih Kosong
              </div>
              <p style={{color:"var(--text-soft)",fontSize:13,lineHeight:1.7}}>
                Google Sheets belum memiliki data, tetapi ditemukan
                <strong> {(saved?.transaksi||[]).length} transaksi</strong> di browser ini.<br/><br/>
                Apakah ingin mengupload data lokal sebagai <strong>data awal</strong> ke Google Sheets?
              </p>
            </div>
            <div style={{background:"var(--gold-light)",borderRadius:10,padding:"10px 14px",
              fontSize:12,color:"var(--gold)",marginBottom:16,lineHeight:1.6}}>
              💡 Pilih <strong>Upload</strong> jika ini adalah perangkat utama Anda dan data lokal sudah benar.<br/>
              Pilih <strong>Mulai Kosong</strong> jika ingin memulai dari awal.
            </div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-secondary" style={{flex:1,justifyContent:"center"}}
                onClick={()=>applyStartupData("kosong")}>
                🗑️ Mulai Kosong
              </button>
              <button className="btn btn-primary" style={{flex:1,justifyContent:"center"}}
                onClick={()=>applyStartupData("upload")}>
                📤 Upload Data Lokal ke Sheets
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL SYNC CONFLICT: WAJIB MUAT TERBARU ────────────────────── */}
      {modal==="syncConflict" && (
        <div className="modal-overlay" style={{zIndex:400}}>
          <div className="modal" style={{maxWidth:440}}>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:48,marginBottom:8}}>⚠️</div>
              <div className="modal-title" style={{justifyContent:"center",marginBottom:8,color:"#E65100"}}>
                Data Sheets Sudah Diupdate
              </div>
              <p style={{color:"var(--text-soft)",fontSize:13,lineHeight:1.7}}>
                Seseorang telah mengupdate data di Google Sheets sejak Anda membuka aplikasi ini.<br/><br/>
                <strong>Anda harus memuat data terbaru</strong> sebelum bisa menyimpan, untuk menghindari data tertimpa.
              </p>
            </div>
            <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}}
              onClick={handleSyncConflict}>
              🔄 Muat Data Terbaru dari Google Sheets
            </button>
            <div style={{marginTop:10,fontSize:11,color:"var(--text-soft)",textAlign:"center"}}>
              Perubahan yang belum tersimpan akan perlu diinput ulang setelah memuat data terbaru.
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && <div className={`toast toast-${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML = "<div style='padding:40px;font-family:sans-serif;color:red'><h2>Error loading app:</h2><pre>" + e.message + "</pre></div>";
  console.error(e);
}
</script>
</body>
</html>
